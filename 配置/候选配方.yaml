release_id: tpu-virtual-formulation-2026-07-22-v1

# 三类构件均来自冻结 Gold-V；数量是为可审计复核而设的多样性子集，不代表商业目录。
selection_counts:
  diisocyanate: 96
  chain_extender_diol: 24
  macrodiol: 16

# 每个二异氰酸酯轮转搭配4个宏二醇代理，每个宏二醇代理再搭配3个二醇扩链剂。
# 因此组合数为96 × 4 × 3 = 1,152，而非三组分的全笛卡尔积。
combination_design:
  macro_choices_per_diisocyanate: 4
  extender_choices_per_macro: 3

# macrodiol_nominal_mn 是未来宏二醇合成/采购的目标Mn，不是 Gold-V 小分子代理结构的实测Mn。
formulation_grid:
  macrodiol_nominal_mn_g_mol: [1000.0, 2000.0]
  hard_segment_mass_fraction_target: [0.35, 0.45]
  nco_oh_ratio_target: [1.0, 1.02]

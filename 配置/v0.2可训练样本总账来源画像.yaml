count_semantics:
  source_record_count: 来源报告的记录/容器级科学条目；不等于独立样本。
  material_count: 可区分材料牌号或材料代码数；商业牌号不等于配方已知。
  formulation_count: 具有显式配方标签或可区分配方代码的数量；空值表示无法从审计确认。
  batch_count: 可确认合成或制备批次键数量。
  specimen_count: 可确认物理试样或明确试样槽数量；试样槽可能仍需跨表去重。
  run_count: 可确认实验运行或计算运行数量；运行内点/帧不增加该计数。
  curve_count_observed: 已审计的曲线/历史总量，含随后隔离或降权的记录。
  curve_count_candidate: 通过当前科学门、可在后续权利与拆分闭合后进入相应任务的候选曲线数；不是模型就绪数。
  scalar_count_observed: 已审计的标量记录总量，含随后隔离或降权的记录。
  scalar_count_candidate: 通过当前科学门、可在后续权利与拆分闭合后进入相应任务的候选标量数；不是模型就绪数。
  point_count_observed: 曲线点、同步点或轨迹帧的来源内计数；永远不当作独立样本。
  point_count_candidate: 当前科学门后保留的点/帧计数；仍只提高同一序列的数值精度。
  numeric_value_count: 无法可靠还原为曲线点或标量实体时，仅报告有限数值单元格/数值 occurrence。
  evidence_group_count: 只证明表、图或方法存在的证据组数量；未物化前训练权重为零。
  computational_system_count: 可确认的独立计算化学体系/路径数量；输出文件、构象和帧不自动扩大该数。

audit_metric_semantics:
  direct_numeric_total: 审计表中有限的直接数值总数，可能包含载荷、面积和工艺输入，不能直接当作响应标量数。
  complete_direct_response_count: 字段语义和实体身份完整的直接响应数，仍可能含只作对照验证的记录。
  valid_derived_scalar_count: 可由完整直接响应确定性复算的有效规范单位标量；与母响应不可重复计权。
  invalid_cached_formula_count: 公式输入缺失但工作簿缓存残留数值的单元格数；只作异常证据，训练权重为零。
  known_missing_direct_count: 已知应有但为空的直接响应数；不是零值，也不计入观测标量。


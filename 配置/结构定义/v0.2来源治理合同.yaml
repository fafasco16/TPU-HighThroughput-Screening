schema_version: v0.2
id_algorithm_version: uuid5-v1
tables:
  record_registry:
    description: 跨快照稳定实体身份注册表
    revision_policy: immutable_append_only
    primary_key: [record_uid]
    unique_constraints:
      - name: uq_record_registry_identity
        fields: [entity_type, identity_key_sha256, id_algorithm_version]
      - name: uq_record_registry_uid_entity
        fields: [record_uid, entity_type]
    foreign_keys: []
    checks:
      - name: ck_record_registry_identity_hash
        expression: "length(identity_key_sha256) = 64 AND regexp_full_match(identity_key_sha256, '^[0-9a-f]{64}$') AND identity_key_sha256 = sha256(CAST(canonical_identity_key_json AS VARCHAR))"
      - name: ck_record_registry_identity_key
        expression: "json_valid(canonical_identity_key_json) AND json_type(canonical_identity_key_json) = 'OBJECT' AND length(CAST(canonical_identity_key_json AS VARCHAR)) > 1"
      - name: ck_record_registry_uuid5
        expression: "regexp_full_match(record_uid, '^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')"
      - name: ck_record_registry_algorithm
        expression: "id_algorithm_version = 'uuid5-v1'"
    fields:
      record_uid: {description: 跨快照稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      entity_type: {description: 稳定记录对应的实体类别, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      canonical_identity_key_json: {description: Unicode规范化后的完整身份键JSON, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      identity_key_sha256: {description: 完整身份键的SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      id_algorithm_version: {description: 稳定标识算法版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      registered_at: {description: 记录首次登记的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      registered_by: {description: 执行登记的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  dataset_snapshot:
    description: 来源治理记录选择与权利裁决所依附的数据集快照
    revision_policy: immutable_after_freeze
    primary_key: [snapshot_id]
    unique_constraints:
      - name: uq_dataset_snapshot_label_created
        fields: [snapshot_label, created_at]
    foreign_keys: []
    checks:
      - name: ck_dataset_snapshot_schema_hash
        expression: "length(schema_hash) = 64 AND regexp_full_match(schema_hash, '^[0-9a-f]{64}$')"
      - name: ck_dataset_snapshot_enum_hash
        expression: "length(enum_hash) = 64 AND regexp_full_match(enum_hash, '^[0-9a-f]{64}$')"
      - name: ck_dataset_snapshot_rule_hash
        expression: "length(rule_catalog_hash) = 64 AND regexp_full_match(rule_catalog_hash, '^[0-9a-f]{64}$')"
      - name: ck_dataset_snapshot_logical_hash
        expression: "logical_hash IS NULL OR (length(logical_hash) = 64 AND regexp_full_match(logical_hash, '^[0-9a-f]{64}$'))"
      - name: ck_dataset_snapshot_logical_algorithm
        expression: "logical_hash_algorithm_version = 'tpu-logical-hash/1'"
      - name: ck_dataset_snapshot_time_order
        expression: "frozen_at IS NULL OR frozen_at >= created_at"
      - name: ck_dataset_snapshot_approval_separation
        expression: "approved_by IS NULL OR approved_by <> created_by"
    fields:
      snapshot_id: {description: 数据集快照稳定标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_label: {description: 便于审阅的快照标签, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_status: {description: 快照构建与冻结状态, type: string, required: true, enum: snapshot_status, arrow_type: string, duckdb_type: VARCHAR}
      schema_version: {description: 快照所选记录修订必须兼容的合同版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      schema_hash: {description: 本快照使用的来源治理合同哈希, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      enum_hash: {description: 本快照使用的枚举目录哈希, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rule_catalog_hash: {description: 本快照使用的质量规则目录哈希, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      logical_hash: {description: 快照全部逻辑表的规范逻辑哈希, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      logical_hash_algorithm_version: {description: 快照逻辑哈希的已发布算法版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 快照创建UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      created_by: {description: 创建快照的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      frozen_at: {description: 快照通过冻结审阅的UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      approved_by: {description: 与提出者分离的快照批准主体, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}

  source:
    description: 论文数据记录仓库软件或作者通信的版本化来源
    revision_policy: immutable_append_only
    primary_key: [source_id]
    unique_constraints:
      - name: uq_source_record_uid
        fields: [record_uid]
      - name: uq_source_canonical_version
        fields: [source_kind, canonical_identifier, version_label]
    foreign_keys:
      - name: fk_source_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
    checks:
      - name: ck_source_canonical_identifier
        expression: "length(trim(canonical_identifier)) > 0"
      - name: ck_source_version_label
        expression: "length(trim(version_label)) > 0"
    fields:
      source_id: {description: 版本化来源主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 来源对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_kind: {description: 来源载体类别, type: string, required: true, enum: source_kind, arrow_type: string, duckdb_type: VARCHAR}
      canonical_identifier: {description: DOI仓库地址或通信编号等规范标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      version_label: {description: 来源版本或明确的unversioned标签, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      title: {description: 来源正式题名, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      publisher_or_repository: {description: 出版者仓库或许可方名称, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      discovered_at: {description: 首次发现来源的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      registered_at: {description: 来源完成登记的UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      notes: {description: 不参与身份的来源审计说明, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}

  source_family:
    description: 以证据定义且防止镜像伴随材料或派生数据虚增来源独立性的正式来源族
    revision_policy: immutable_append_only
    primary_key: [source_family_id]
    unique_constraints:
      - name: uq_source_family_record_uid
        fields: [record_uid]
      - name: uq_source_family_key
        fields: [source_family_key]
    foreign_keys:
      - name: fk_source_family_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
    checks:
      - name: ck_source_family_key
        expression: "length(trim(source_family_key)) > 0"
      - name: ck_source_family_basis
        expression: "length(trim(independence_basis)) > 0"
    fields:
      source_family_id: {description: 正式来源族稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 来源族对应的跨快照稳定实体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_family_key: {description: 来源独立性保护与数据划分使用的稳定来源族键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_family_type: {description: 来源族形成的可审计依据类别, type: string, required: true, enum: source_family_type, arrow_type: string, duckdb_type: VARCHAR}
      independence_basis: {description: 判定成员属于同一来源族的科学与证据依据, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 来源族不可变声明形成的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      created_by: {description: 建立来源族声明的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  source_family_membership:
    description: 将来源或其具体范围以可定位证据绑定到正式来源族的不可变成员关系
    revision_policy: immutable_append_only
    primary_key: [family_membership_id]
    unique_constraints:
      - name: uq_source_family_membership_scope
        fields: [source_family_id, source_id, source_scope_id]
    foreign_keys:
      - name: fk_source_family_membership_family
        fields: [source_family_id]
        references: {table: source_family, fields: [source_family_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_family_membership_source
        fields: [source_id]
        references: {table: source, fields: [source_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_family_membership_scope_same_source
        fields: [source_scope_id, source_id]
        references: {table: source_scope, fields: [source_scope_id, source_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_family_membership_locator
        fields: [evidence_locator_id]
        references: {table: source_locator, fields: [source_locator_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_source_family_membership_evidence
        expression: "evidence_locator_id IS NOT NULL OR length(trim(evidence_summary)) > 0"
    fields:
      family_membership_id: {description: 来源族成员关系稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_family_id: {description: 成员归属的正式来源族, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_id: {description: 成员所属的版本化来源, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 可选的更具体来源范围且必须属于同一来源, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      membership_role: {description: 来源或范围在来源族中的成员角色, type: string, required: true, enum: source_family_membership_role, arrow_type: string, duckdb_type: VARCHAR}
      evidence_locator_id: {description: 支持来源族成员判定的精确来源定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      evidence_summary: {description: 支持成员判定且不可为空的审计摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      review_status: {description: 来源族成员关系的独立复核状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      assigned_at: {description: 成员关系形成的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      assigned_by: {description: 建立成员关系的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  source_scope:
    description: 来源独立性计数权利和版本适用范围的共同边界
    revision_policy: immutable_append_only
    primary_key: [source_scope_id]
    unique_constraints:
      - name: uq_source_scope_record_uid
        fields: [record_uid]
      - name: uq_source_scope_key
        fields: [source_scope_key]
      - name: uq_source_scope_canonical_version
        fields: [source_id, scope_kind, canonical_identifier, version_label]
      - name: uq_source_scope_id_source
        fields: [source_scope_id, source_id]
    foreign_keys:
      - name: fk_source_scope_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_source_scope_source
        fields: [source_id]
        references: {table: source, fields: [source_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_scope_parent_same_source
        fields: [parent_scope_id, source_id]
        references: {table: source_scope, fields: [source_scope_id, source_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_source_scope_not_self_parent
        expression: "parent_scope_id IS NULL OR parent_scope_id <> source_scope_id"
      - name: ck_source_scope_identifier
        expression: "length(trim(canonical_identifier)) > 0 AND length(trim(version_label)) > 0"
    fields:
      source_scope_id: {description: 来源范围稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_key: {description: 资产规则和来源配置共同使用的稳定范围键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 来源范围对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_id: {description: 来源范围所属的版本化来源, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      parent_scope_id: {description: 更细范围所从属的直接父范围, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      scope_kind: {description: 来源范围层级类别, type: string, required: true, enum: source_scope_kind, arrow_type: string, duckdb_type: VARCHAR}
      canonical_identifier: {description: 本范围在所属来源内的规范标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      version_label: {description: 本范围版本或明确的unversioned标签, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      independence_basis: {description: 独立材料制备或独立实验判定依据, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      rights_scope_note: {description: 权利事实适用范围的原始审计说明, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 来源范围登记UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  content_blob:
    description: 以原始文件字节SHA256唯一寻址且与具体路径或来源范围无关的内容对象
    revision_policy: immutable_append_only
    primary_key: [content_blob_uid]
    unique_constraints:
      - name: uq_content_blob_sha256
        fields: [content_sha256]
      - name: uq_content_blob_chain
        fields: [content_blob_uid, content_sha256, size_bytes]
    foreign_keys: []
    checks:
      - name: ck_content_blob_sha256
        expression: "length(content_sha256) = 64 AND regexp_full_match(content_sha256, '^[0-9a-f]{64}$')"
      - name: ck_content_blob_uid
        expression: "content_blob_uid = 'sha256:' || content_sha256"
      - name: ck_content_blob_size
        expression: "size_bytes >= 0"
    fields:
      content_blob_uid: {description: 由sha256前缀和小写字节摘要组成的内容对象标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      content_sha256: {description: 内容对象原始字节的完整小写SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      size_bytes: {description: 内容对象精确原始字节数, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      first_observed_at: {description: 项目首次确认该字节内容存在的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  source_file:
    description: 绑定来源范围并以内容哈希和稳定自然键识别的原始文件
    revision_policy: immutable_append_only
    primary_key: [source_file_id]
    unique_constraints:
      - name: uq_source_file_record_uid
        fields: [record_uid]
      - name: uq_source_file_occurrence_uid
        fields: [asset_occurrence_uid]
      - name: uq_source_file_natural_key
        fields: [source_scope_id, source_file_natural_key]
      - name: uq_source_file_id_scope
        fields: [source_file_id, source_scope_id]
      - name: uq_source_file_id_scope_hash
        fields: [source_file_id, source_scope_id, content_sha256]
    foreign_keys:
      - name: fk_source_file_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_source_file_source_scope
        fields: [source_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_file_content_blob
        fields: [content_blob_uid, content_sha256, size_bytes]
        references: {table: content_blob, fields: [content_blob_uid, content_sha256, size_bytes]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_source_file_sha256
        expression: "length(content_sha256) = 64 AND regexp_full_match(content_sha256, '^[0-9a-f]{64}$')"
      - name: ck_source_file_size
        expression: "size_bytes >= 0"
      - name: ck_source_file_relative_path
        expression: "length(relative_path) > 0 AND relative_path = trim(relative_path) AND relative_path NOT LIKE '/%' AND relative_path NOT LIKE '%/' AND relative_path NOT LIKE '%\\\\%' AND relative_path NOT LIKE '%//%' AND relative_path <> '..' AND relative_path NOT LIKE '../%' AND relative_path NOT LIKE '%/../%' AND relative_path NOT LIKE '%/..' AND relative_path <> '.' AND relative_path NOT LIKE './%' AND relative_path NOT LIKE '%/./%' AND relative_path NOT LIKE '%/.' AND NOT regexp_matches(relative_path, '^[A-Za-z]:')"
      - name: ck_source_file_retrieval_time_evidence
        expression: "(retrieved_at IS NOT NULL AND retrieved_at_unknown_reason IS NULL) OR (retrieved_at IS NULL AND retrieved_at_unknown_reason IS NOT NULL)"
    fields:
      source_file_id: {description: 来源范围内稳定文件主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 文件对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 文件所属的最具体来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      asset_occurrence_uid: {description: 扫描范围与规范相对路径生成的稳定出现标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_file_natural_key: {description: 来源范围内不含本地绝对路径的文件自然键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      content_blob_uid: {description: 由文件字节SHA256定义的内容对象标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      original_name: {description: 来源提供的原始文件名, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      file_extension: {description: 从原始文件名规范提取且保留前导点的扩展名, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      relative_path: {description: Unicode规范化且使用正斜线的项目相对路径, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      discovery_scope_key: {description: 产生文件出现记录的版本化扫描范围键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      scanner_version: {description: 发现和读取文件的扫描器实现版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      size_bytes: {description: 文件字节数, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      content_sha256: {description: 文件原始字节SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      media_type: {description: 探测或声明的互联网媒体类型, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      retrieval_method: {description: 文件进入项目范围的获取方式, type: string, required: true, enum: retrieval_method, arrow_type: string, duckdb_type: VARCHAR}
      retrieved_at: {description: 有证据支持的文件获取UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      retrieved_at_unknown_reason: {description: 无可靠获取时间时不得用盘点时间替代的明确原因, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      first_observed_at: {description: 项目首次确认文件存在的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      read_status: {description: 本次登记读取状态, type: string, required: true, enum: read_status, arrow_type: string, duckdb_type: VARCHAR}

  source_locator:
    description: 文件内工作表页面表格图形单元格行列或仓库路径的精确定位
    revision_policy: immutable_append_only
    primary_key: [source_locator_id]
    unique_constraints:
      - name: uq_source_locator_record_uid
        fields: [record_uid]
      - name: uq_source_locator_file_hash
        fields: [source_file_id, locator_hash]
      - name: uq_source_locator_id_file
        fields: [source_locator_id, source_file_id]
    foreign_keys:
      - name: fk_source_locator_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_source_locator_source_file
        fields: [source_file_id]
        references: {table: source_file, fields: [source_file_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_source_locator_hash
        expression: "length(locator_hash) = 64 AND regexp_full_match(locator_hash, '^[0-9a-f]{64}$') AND locator_hash = sha256(CAST(locator_json AS VARCHAR))"
      - name: ck_source_locator_payload
        expression: "length(trim(locator_text)) > 0 AND json_valid(locator_json) AND json_type(locator_json) = 'OBJECT'"
      - name: ck_source_locator_hash_algorithm
        expression: "locator_hash_algorithm_version = 'tpu-locator-json/1'"
    fields:
      source_locator_id: {description: 精确定位主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 定位对象对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_file_id: {description: 定位所属来源文件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      locator_type: {description: 定位表达的载体类别, type: string, required: true, enum: locator_type, arrow_type: string, duckdb_type: VARCHAR}
      locator_text: {description: 便于人工核验的稳定定位文本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      locator_json: {description: 页表图单元格行列或JSON指针等结构化定位, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      locator_hash: {description: 规范定位JSON对象的完整SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      locator_hash_algorithm_version: {description: 定位JSON规范化和哈希的已发布算法版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 定位登记UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  source_scope_relation:
    description: 两个来源范围之间有证据支持的方向性关系
    revision_policy: immutable_append_only
    primary_key: [relation_id]
    unique_constraints:
      - name: uq_source_scope_relation_edge
        fields: [subject_scope_id, object_scope_id, relation_type]
    foreign_keys:
      - name: fk_source_scope_relation_subject
        fields: [subject_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_scope_relation_object
        fields: [object_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_source_scope_relation_locator
        fields: [evidence_locator_id]
        references: {table: source_locator, fields: [source_locator_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_source_scope_relation_not_self
        expression: "subject_scope_id <> object_scope_id"
      - name: ck_source_scope_relation_evidence
        expression: "length(evidence_summary) > 0"
    fields:
      relation_id: {description: 来源范围关系主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      subject_scope_id: {description: 方向关系的主语来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      object_scope_id: {description: 方向关系的宾语来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      relation_type: {description: 来源范围关系类型, type: string, required: true, enum: source_scope_relation_type, arrow_type: string, duckdb_type: VARCHAR}
      evidence_locator_id: {description: 支持关系判断的精确来源定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      evidence_summary: {description: 不替代原证据的关系判断摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      review_status: {description: 来源关系的人工核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      asserted_by: {description: 提交关系断言的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      asserted_at: {description: 提交关系断言的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  asset_decision:
    description: 在特定快照中对一个来源文件给出的唯一角色分类与处置决定
    revision_policy: immutable_append_only
    primary_key: [decision_id]
    unique_constraints:
      - name: uq_asset_decision_snapshot_file
        fields: [snapshot_id, source_file_id]
    foreign_keys:
      - name: fk_asset_decision_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_asset_decision_file_scope
        fields: [source_file_id, source_scope_id]
        references: {table: source_file, fields: [source_file_id, source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_asset_decision_locator_file
        fields: [source_locator_id, source_file_id]
        references: {table: source_locator, fields: [source_locator_id, source_file_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_asset_decision_rule_identity
        expression: "length(rule_id) > 0 AND length(rule_version) > 0"
      - name: ck_asset_decision_evidence_json
        expression: "json_valid(evidence_json) AND json_type(evidence_json) = 'OBJECT'"
    fields:
      decision_id: {description: 文件角色与处置决定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 选择该不可变文件决定的数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_file_id: {description: 被决定的来源文件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 被决定文件所属且由复合外键锁定的来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_locator_id: {description: 可选的文件内决定证据定位且必须属于同一文件, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      artifact_role: {description: 决定采用的文件资产角色, type: string, required: true, enum: artifact_role, arrow_type: string, duckdb_type: VARCHAR}
      data_stage: {description: 决定采用的文件数据阶段, type: string, required: true, enum: data_stage, arrow_type: string, duckdb_type: VARCHAR}
      material_scope_hint: {description: 仅供资产路由且不得替代逐记录材料域裁决的材料范围提示, type: string, required: true, enum: material_scope, arrow_type: string, duckdb_type: VARCHAR}
      decision_action: {description: 对文件采取的治理动作, type: string, required: true, enum: asset_decision_action, arrow_type: string, duckdb_type: VARCHAR}
      decision_method: {description: 机器规则人工复核或证据排除的决定方式, type: string, required: true, enum: decision_method, arrow_type: string, duckdb_type: VARCHAR}
      reason_code: {description: 解释角色分类处置或复核要求的机器可读原因码, type: string, required: true, enum: asset_decision_reason_code, arrow_type: string, duckdb_type: VARCHAR}
      rule_id: {description: 产生决定的机器规则或人工规则标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rule_version: {description: 产生决定的规则版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_json: {description: 规则命中冲突与审阅依据的结构化证据, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      reviewer: {description: 完成人工复核的主体标识, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      decided_at: {description: 决定形成的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  count_assertion:
    description: 区分出版声称仓库元数据临时审计和入库复算的计数断言
    revision_policy: immutable_append_only
    primary_key: [count_assertion_id]
    unique_constraints:
      - name: uq_count_assertion_key
        fields: [assertion_key]
    foreign_keys:
      - name: fk_count_assertion_source_scope
        fields: [source_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_count_assertion_file_scope_hash
        fields: [source_file_id, source_scope_id, source_file_sha256]
        references: {table: source_file, fields: [source_file_id, source_scope_id, content_sha256]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_count_assertion_locator_file
        fields: [source_locator_id, source_file_id]
        references: {table: source_locator, fields: [source_locator_id, source_file_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_count_assertion_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_count_assertion_recount_transformation
        fields: [recount_transformation_id]
        references: {table: transformation_run, fields: [transformation_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_count_assertion_nonnegative
        expression: "asserted_count >= 0"
      - name: ck_count_assertion_frozen_evidence
        expression: "assertion_status <> 'frozen_fact' OR count_evidence_type = 'ingested_file_recount'"
      - name: ck_count_assertion_file_hash
        expression: "source_file_sha256 IS NULL OR (length(source_file_sha256) = 64 AND regexp_full_match(source_file_sha256, '^[0-9a-f]{64}$'))"
    fields:
      count_assertion_id: {description: 计数断言主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      assertion_key: {description: 对计数对象证据规则和范围规范编码的稳定键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 计数断言适用的最具体来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_file_id: {description: 入库复算或文件审计所绑定的来源文件, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      source_locator_id: {description: 出版声称或仓库元数据所在的精确定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 入库复算计数所绑定的数据集快照, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      count_object_type: {description: 被计数对象的语义类别, type: string, required: true, enum: count_object_type, arrow_type: string, duckdb_type: VARCHAR}
      asserted_count: {description: 来源声称或机器复算的非负计数值, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      count_evidence_type: {description: 计数证据的取得层级, type: string, required: true, enum: count_evidence_type, arrow_type: string, duckdb_type: VARCHAR}
      filtering_rule: {description: 计数前过滤规则及版本, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      deduplication_rule: {description: 计数前去重规则及版本, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      parser_version: {description: 产生入库复算计数的解析器版本, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      source_file_sha256: {description: 复算输入文件的原始字节SHA256, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      recount_transformation_id: {description: 产生冻结复算计数且必须成功的不可变转换执行, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      assertion_status: {description: 计数断言是否仅临时或已具备冻结事实条件, type: string, required: true, enum: count_assertion_status, arrow_type: string, duckdb_type: VARCHAR}
      asserted_by: {description: 提交计数断言的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      asserted_at: {description: 计数断言形成的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  citation:
    description: 具有稳定引用键和结构化书目信息的论文数据软件或权利来源引用
    revision_policy: immutable_append_only
    primary_key: [citation_id]
    unique_constraints:
      - name: uq_citation_record_uid
        fields: [record_uid]
      - name: uq_citation_key
        fields: [citation_key]
      - name: uq_citation_id_source
        fields: [citation_id, source_id]
    foreign_keys:
      - name: fk_citation_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_citation_source
        fields: [source_id]
        references: {table: source, fields: [source_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_citation_supersedes
        fields: [supersedes_citation_id, source_id]
        references: {table: citation, fields: [citation_id, source_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_citation_key
        expression: "length(trim(citation_key)) > 0"
      - name: ck_citation_year
        expression: "issued_year IS NULL OR issued_year BETWEEN 1600 AND 3000"
      - name: ck_citation_not_self_supersedes
        expression: "supersedes_citation_id IS NULL OR supersedes_citation_id <> citation_id"
      - name: ck_citation_reference_text
        expression: "length(trim(reference_text)) > 0"
    fields:
      citation_id: {description: 引用记录主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 引用对象对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_id: {description: 引用所描述且用于约束修订归属的版本化来源, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      citation_key: {description: 论文写作和机器对账使用的稳定引用键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      citation_type: {description: 论文数据软件许可或网页等引用载体类别, type: string, required: true, enum: citation_type, arrow_type: string, duckdb_type: VARCHAR}
      title: {description: 引用对象正式题名, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      authors_json: {description: 保留顺序和姓名结构的作者列表, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      issued_year: {description: 引用对象正式发表或发布年份, type: integer, required: false, arrow_type: int64, duckdb_type: BIGINT}
      doi: {description: 论文或数据对象的规范DOI, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      canonical_url: {description: 引用对象规范访问入口, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      csl_json: {description: 可直接导出CSL的结构化书目信息, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      reference_text: {description: 经核验且可直接用于论文参考文献表的完整引用字符串, type: string, required: true, arrow_type: large_string, duckdb_type: TEXT}
      bibtex_text: {description: 经核验的BibTeX文本, type: string, required: false, arrow_type: large_string, duckdb_type: TEXT}
      supersedes_citation_id: {description: 本引用记录明确替代的旧引用版本, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      accessed_at: {description: 网页或仓库引用的UTC访问时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      review_status: {description: 引用字段核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}

  citation_assignment:
    description: 将引用以明确角色绑定到统一稳定治理对象
    revision_policy: immutable_append_only
    primary_key: [citation_assignment_id]
    unique_constraints:
      - name: uq_citation_assignment_role
        fields: [citation_id, target_uid, citation_role]
    foreign_keys:
      - name: fk_citation_assignment_citation
        fields: [citation_id]
        references: {table: citation, fields: [citation_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_citation_assignment_target
        fields: [target_uid, expected_entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_citation_assignment_expected_type
        expression: "length(expected_entity_type) > 0"
    fields:
      citation_assignment_id: {description: 引用角色分配主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      citation_id: {description: 被分配的稳定引用记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      target_uid: {description: 接受引用分配的统一稳定治理对象, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      expected_entity_type: {description: 对目标记录实体类别的显式预期, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      citation_role: {description: 引用对目标承担的数据方法软件测量派生或许可角色, type: string, required: true, enum: citation_role, arrow_type: string, duckdb_type: VARCHAR}
      assignment_note: {description: 说明引用适用范围且不替代原书目信息, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      assigned_by: {description: 分配引用的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      assigned_at: {description: 引用分配UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      review_status: {description: 引用分配核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}

  rights_evidence_package:
    description: 归档官方页面接口条款通信限制或撤回通知正文和响应元数据的不可变证据包
    revision_policy: immutable_append_only
    primary_key: [evidence_package_id]
    unique_constraints:
      - name: uq_rights_evidence_record_uid
        fields: [record_uid]
      - name: uq_rights_evidence_identity
        fields: [evidence_identity_key]
      - name: uq_rights_evidence_id_target
        fields: [evidence_package_id, target_uid]
    foreign_keys:
      - name: fk_rights_evidence_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_rights_evidence_target
        fields: [target_uid, expected_entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_evidence_source_scope
        fields: [source_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_evidence_supersedes
        fields: [supersedes_evidence_package_id, target_uid]
        references: {table: rights_evidence_package, fields: [evidence_package_id, target_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_rights_evidence_http_status
        expression: "http_status IS NULL OR http_status BETWEEN 100 AND 599"
      - name: ck_rights_evidence_byte_count
        expression: "byte_count IS NULL OR byte_count >= 0"
      - name: ck_rights_evidence_body_hash
        expression: "body_sha256 IS NULL OR (length(body_sha256) = 64 AND regexp_full_match(body_sha256, '^[0-9a-f]{64}$'))"
      - name: ck_rights_evidence_session_fingerprint
        expression: "session_fingerprint_sha256 IS NULL OR (length(session_fingerprint_sha256) = 64 AND regexp_full_match(session_fingerprint_sha256, '^[0-9a-f]{64}$'))"
      - name: ck_rights_evidence_verified_archive
        expression: "capture_status <> 'archived_verified' OR (body_archive_path IS NOT NULL AND body_sha256 IS NOT NULL AND response_headers_json IS NOT NULL AND verified_by IS NOT NULL AND verified_at IS NOT NULL)"
      - name: ck_rights_evidence_session_not_archive
        expression: "capture_status <> 'captured_unverified' OR body_archive_path IS NULL"
      - name: ck_rights_evidence_not_self_supersedes
        expression: "supersedes_evidence_package_id IS NULL OR supersedes_evidence_package_id <> evidence_package_id"
      - name: ck_rights_evidence_archive_path
        expression: "body_archive_path IS NULL OR (length(body_archive_path) > 0 AND body_archive_path = trim(body_archive_path) AND body_archive_path NOT LIKE '/%' AND body_archive_path NOT LIKE '%/' AND body_archive_path NOT LIKE '%\\\\%' AND body_archive_path NOT LIKE '%//%' AND body_archive_path <> '..' AND body_archive_path NOT LIKE '../%' AND body_archive_path NOT LIKE '%/../%' AND body_archive_path NOT LIKE '%/..' AND NOT regexp_matches(body_archive_path, '^[A-Za-z]:'))"
      - name: ck_rights_evidence_headers_shape
        expression: "response_headers_json IS NULL OR (json_valid(response_headers_json) AND json_type(response_headers_json) = 'OBJECT')"
      - name: ck_rights_evidence_fingerprint_pair
        expression: "(session_fingerprint_sha256 IS NULL) = (session_fingerprint_scope IS NULL)"
    fields:
      evidence_package_id: {description: 不可变权利证据包主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 证据包自身对应的统一稳定记录标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      target_uid: {description: 证据包最直接适用的统一稳定治理对象, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      expected_entity_type: {description: 对证据包目标实体类别的显式预期, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 证据声明最具体适用的来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_identity_key: {description: URL时间内容版本和适用范围的规范证据身份键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_type: {description: 仓库元数据许可文本条款或撤回通知等证据类别, type: string, required: true, enum: rights_evidence_type, arrow_type: string, duckdb_type: VARCHAR}
      authority_type: {description: 官方仓库出版商许可人作者或第三方等权威类别, type: string, required: true, enum: rights_authority_type, arrow_type: string, duckdb_type: VARCHAR}
      canonical_url: {description: 证据请求前的规范URL, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      resolved_url: {description: 重定向完成后的最终URL, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      retrieval_method: {description: 证据页面正文或响应的获取方式, type: string, required: true, enum: retrieval_method, arrow_type: string, duckdb_type: VARCHAR}
      http_status: {description: 获取证据时观察到的HTTP状态码, type: integer, required: false, arrow_type: int64, duckdb_type: BIGINT}
      retrieved_at: {description: 证据响应实际获取UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      etag: {description: 证据响应ETag头原值, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      last_modified: {description: 证据响应LastModified头原值, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      media_type: {description: 证据响应正文媒体类型, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      charset: {description: 证据响应声明或探测的字符集, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      byte_count: {description: 证据正文原始字节数, type: integer, required: false, arrow_type: int64, duckdb_type: BIGINT}
      body_archive_path: {description: 项目内归档证据正文的相对路径, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      body_sha256: {description: 归档证据正文原始字节SHA256, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      session_fingerprint_sha256: {description: 未归档在线核验会话响应的临时SHA256指纹, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      session_fingerprint_scope: {description: 明确指纹仅覆盖本次会话响应而非归档正文的范围说明, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      response_headers_json: {description: 证据响应头的规范结构化归档, type: json, required: false, arrow_type: string, duckdb_type: JSON}
      locator_text: {description: 证据正文内与权利事实有关的精确定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      applicable_version: {description: 证据明确适用的来源文件或条款版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      raw_license_expression: {description: 证据中原样观察到的许可表达, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      canonical_license_expression: {description: 规范化但不扩大范围的许可表达, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      terms_url: {description: 证据明确链接的服务条款地址, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      availability_status: {description: 证据对应对象的可获得性状态, type: string, required: true, enum: availability_status, arrow_type: string, duckdb_type: VARCHAR}
      capture_status: {description: 会话指纹归档正文和人工核验的证据捕获状态, type: string, required: true, enum: rights_capture_status, arrow_type: string, duckdb_type: VARCHAR}
      captured_by: {description: 获取并登记证据的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      verified_by: {description: 核验归档正文适用范围和权威性的主体标识, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      verified_at: {description: 完成证据核验的UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      conflict_group_id: {description: 同一对象版本范围内冲突证据的分组标识, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      supersedes_evidence_package_id: {description: 本证据包明确替代的旧证据包, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}

  rights_fact:
    description: 从已登记证据包中提取且绑定最具体来源范围的原子权利事实
    revision_policy: immutable_append_only
    primary_key: [rights_fact_id]
    unique_constraints:
      - name: uq_rights_fact_atomic_scope
        fields: [evidence_package_id, source_scope_id, predicate, fact_value, applicability_key]
      - name: uq_rights_fact_id_object
        fields: [rights_fact_id, source_scope_id, predicate, applicability_key]
    foreign_keys:
      - name: fk_rights_fact_evidence_package
        fields: [evidence_package_id]
        references: {table: rights_evidence_package, fields: [evidence_package_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_fact_source_scope
        fields: [source_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_fact_supersedes
        fields: [supersedes_rights_fact_id, source_scope_id, predicate, applicability_key]
        references: {table: rights_fact, fields: [rights_fact_id, source_scope_id, predicate, applicability_key]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_rights_fact_applicability
        expression: "length(trim(applicability_key)) > 0"
      - name: ck_rights_fact_predicate_value
        expression: "(predicate = 'declared_license' AND fact_value IN ('declared', 'not_declared', 'unspecified', 'conflict')) OR (predicate IN ('commercial_use', 'derivative', 'redistribution', 'tdm', 'ai_training') AND fact_value IN ('allowed', 'allowed_with_obligations', 'prohibited', 'unspecified', 'conflict')) OR (predicate = 'attribution' AND fact_value IN ('required', 'not_required', 'unspecified', 'conflict')) OR (predicate = 'access_restriction' AND fact_value IN ('restricted', 'unrestricted', 'unspecified', 'conflict')) OR (predicate = 'withdrawn' AND fact_value IN ('withdrawn', 'active', 'unspecified', 'conflict'))"
      - name: ck_rights_fact_validity
        expression: "valid_until IS NULL OR valid_from IS NULL OR valid_until >= valid_from"
      - name: ck_rights_fact_not_self_supersedes
        expression: "supersedes_rights_fact_id IS NULL OR supersedes_rights_fact_id <> rights_fact_id"
    fields:
      rights_fact_id: {description: 原子权利事实主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_package_id: {description: 事实可回溯的不可变权利证据包, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 权利事实最具体适用的来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      predicate: {description: 许可商业改编再分发TDM训练署名访问或撤回事实谓词, type: string, required: true, enum: rights_fact_predicate, arrow_type: string, duckdb_type: VARCHAR}
      fact_value: {description: 证据明确观察到或未声明的原子事实值, type: string, required: true, enum: rights_fact_value, arrow_type: string, duckdb_type: VARCHAR}
      applicability_key: {description: 对对象版本范围和权利客体的规范适用键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rights_object_class: {description: 原子事实直接适用的权利对象类别, type: string, required: true, enum: rights_object_class, arrow_type: string, duckdb_type: VARCHAR}
      fact_detail: {description: 不扩大证据含义的限制义务或例外原文摘要, type: string, required: false, arrow_type: large_string, duckdb_type: TEXT}
      valid_from: {description: 证据明确声明的事实起效日期, type: date, required: false, arrow_type: date32, duckdb_type: DATE}
      valid_until: {description: 证据明确声明的事实失效日期, type: date, required: false, arrow_type: date32, duckdb_type: DATE}
      review_status: {description: 原子事实提取与适用范围核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      extracted_by: {description: 提取原子权利事实的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      extracted_at: {description: 原子权利事实提取UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      conflict_group_id: {description: 同对象版本范围内互不相容事实的冲突组标识, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      supersedes_rights_fact_id: {description: 本事实明确替代的旧原子权利事实, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}

  context_profile:
    description: 权利动作裁决使用的访问控制托管法域保留期和处理器上下文
    revision_policy: immutable_append_only
    primary_key: [context_profile_id]
    unique_constraints:
      - name: uq_context_profile_hash
        fields: [profile_hash]
    foreign_keys: []
    checks:
      - name: ck_context_profile_hash
        expression: "length(profile_hash) = 64 AND regexp_full_match(profile_hash, '^[0-9a-f]{64}$')"
      - name: ck_context_profile_retention
        expression: "retention_days >= 0"
    fields:
      context_profile_id: {description: 权利裁决上下文配置主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      profile_name: {description: 便于治理人员识别的上下文名称, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      access_control_class: {description: 上下文采用的访问控制类别, type: string, required: true, enum: access_control_class, arrow_type: string, duckdb_type: VARCHAR}
      hosting_class: {description: 数据模型或制品托管类别, type: string, required: true, enum: hosting_class, arrow_type: string, duckdb_type: VARCHAR}
      jurisdiction: {description: 适用法域的规范代码或明确的多法域表达, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      retention_days: {description: 上下文允许保存数据或制品的天数, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      processor_class: {description: 是否及如何使用外部处理器, type: string, required: true, enum: processor_class, arrow_type: string, duckdb_type: VARCHAR}
      external_processor_name: {description: 外部处理器存在时的正式服务主体名称, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      profile_hash: {description: 全部上下文字段规范编码的SHA256, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      review_status: {description: 上下文配置的治理核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      created_by: {description: 建立上下文配置的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 上下文配置建立UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  rights_action_decision:
    description: 对快照目标动作主体目的权利对象和上下文作出的可复算裁决
    revision_policy: immutable_append_only
    primary_key: [rights_decision_id]
    unique_constraints:
      - name: uq_rights_action_decision_axes
        fields: [snapshot_id, target_uid, operation, actor, purpose, rights_object_class, context_profile_id]
    foreign_keys:
      - name: fk_rights_action_decision_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_action_decision_target
        fields: [target_uid, expected_entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_action_decision_context
        fields: [context_profile_id]
        references: {table: context_profile, fields: [context_profile_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_rights_action_decision_rule
        expression: "length(rule_id) > 0 AND length(rule_version) > 0"
      - name: ck_rights_action_decision_evidence_hash
        expression: "length(evidence_closure_hash) = 64 AND regexp_full_match(evidence_closure_hash, '^[0-9a-f]{64}$')"
      - name: ck_rights_action_decision_evidence_algorithm
        expression: "evidence_closure_algorithm_version = 'tpu-rights-closure/1'"
      - name: ck_rights_action_decision_evidence_counts
        expression: "evidence_fact_count >= 0 AND contributing_record_count >= 0 AND (decision NOT IN ('allow', 'allow_with_obligations') OR (evidence_fact_count >= 1 AND contributing_record_count >= 1))"
      - name: ck_rights_action_decision_validity
        expression: "expires_at IS NULL OR expires_at >= decided_at"
      - name: ck_rights_action_decision_obligations
        expression: "decision <> 'allow_with_obligations' OR obligations_json IS NOT NULL"
      - name: ck_rights_action_decision_reason_matrix
        expression: "(decision = 'allow' AND reason_code = 'EXPLICIT_PERMISSION') OR (decision = 'allow_with_obligations' AND reason_code = 'OBLIGATIONS_APPLY') OR (decision = 'deny' AND reason_code IN ('NC_PURPOSE_MISMATCH', 'ND_DERIVATIVE_SHARE', 'ACCESS_WITHDRAWN', 'EXPLICIT_PROHIBITION')) OR (decision = 'manual_review' AND reason_code IN ('EVIDENCE_MISSING', 'SCOPE_UNRESOLVED', 'LICENSE_CONFLICT', 'TDM_AI_UNSPECIFIED', 'AUTHOR_PERMISSION_REQUIRED', 'LINEAGE_INCOMPLETE', 'OBLIGATION_UNSATISFIED'))"
    fields:
      rights_decision_id: {description: 动作级权利裁决主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 裁决适用的数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      target_uid: {description: 裁决直接适用的统一稳定治理对象, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      expected_entity_type: {description: 对裁决目标实体类别的显式预期, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      operation: {description: 获取存储解析转换分析训练发布或部署等动作轴, type: string, required: true, enum: rights_operation, arrow_type: string, duckdb_type: VARCHAR}
      actor: {description: 项目成员机构成员外部处理器公众或商业伙伴等主体轴, type: string, required: true, enum: rights_actor, arrow_type: string, duckdb_type: VARCHAR}
      purpose: {description: 证据审计非商业研究教学基准商业研究或产品服务等目的轴, type: string, required: true, enum: rights_purpose, arrow_type: string, duckdb_type: VARCHAR}
      rights_object_class: {description: 元数据原始规范派生汇总或模型权利对象轴, type: string, required: true, enum: rights_object_class, arrow_type: string, duckdb_type: VARCHAR}
      context_profile_id: {description: 访问托管法域保留和处理器上下文轴, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      decision: {description: 允许附义务允许拒绝或人工复核裁决, type: string, required: true, enum: rights_decision, arrow_type: string, duckdb_type: VARCHAR}
      reason_code: {description: 解释允许阻断或人工复核的机器可读原因码, type: string, required: true, enum: rights_reason_code, arrow_type: string, duckdb_type: VARCHAR}
      obligations_json: {description: 署名许可链接修改说明非商业等义务集合, type: json, required: false, arrow_type: string, duckdb_type: JSON}
      evidence_closure_hash: {description: 全部贡献来源权利事实与血缘闭包的规范SHA256, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_closure_algorithm_version: {description: 权利证据闭包排序和哈希的已发布算法版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_fact_count: {description: 纳入本次裁决证据闭包的原子权利事实数量, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      contributing_record_count: {description: 纳入本次裁决证据闭包的贡献祖先记录数量, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      rule_id: {description: 生成裁决的冻结机器规则标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rule_version: {description: 生成裁决的冻结机器规则版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      reviewed_by: {description: 自动裁决复核或人工裁决负责主体, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      decided_at: {description: 裁决生成UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      expires_at: {description: 裁决必须重新核验的UTC失效时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  rights_decision_evidence:
    description: 将动作级裁决绑定到每个贡献记录和其原子权利事实的全血缘证据关联表
    revision_policy: immutable_append_only
    primary_key: [decision_evidence_id]
    unique_constraints:
      - name: uq_rights_decision_evidence_lineage
        fields: [rights_decision_id, contributing_record_uid, rights_fact_id]
    foreign_keys:
      - name: fk_rights_decision_evidence_decision
        fields: [rights_decision_id]
        references: {table: rights_action_decision, fields: [rights_decision_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_decision_evidence_contributor
        fields: [contributing_record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_rights_decision_evidence_fact
        fields: [rights_fact_id]
        references: {table: rights_fact, fields: [rights_fact_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_rights_decision_evidence_depth
        expression: "lineage_depth >= 0"
    fields:
      decision_evidence_id: {description: 裁决全血缘证据关联主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rights_decision_id: {description: 使用该证据的动作级权利裁决, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      contributing_record_uid: {description: 向裁决目标贡献内容的祖先稳定记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      rights_fact_id: {description: 祖先记录适用的原子权利事实, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_role: {description: 该事实对裁决的支持限制冲突或义务角色, type: string, required: true, enum: decision_evidence_role, arrow_type: string, duckdb_type: VARCHAR}
      lineage_depth: {description: 裁决目标到贡献祖先的非负血缘层级, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      added_at: {description: 证据加入裁决闭包的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  record_revision:
    description: 稳定实体在给定schema和内容哈希下的不可变修订
    revision_policy: immutable_append_only
    primary_key: [record_revision_id]
    unique_constraints:
      - name: uq_record_revision_content
        fields: [record_uid, schema_version, content_hash]
      - name: uq_record_revision_id_uid
        fields: [record_revision_id, record_uid]
      - name: uq_record_revision_sequence
        fields: [record_uid, revision_number]
      - name: uq_record_revision_predecessor
        fields: [record_uid, supersedes_revision_id]
    foreign_keys:
      - name: fk_record_revision_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_revision_supersedes_owner
        fields: [supersedes_revision_id, record_uid]
        references: {table: record_revision, fields: [record_revision_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_record_revision_content_hash
        expression: "length(content_hash) = 64 AND regexp_full_match(content_hash, '^[0-9a-f]{64}$')"
      - name: ck_record_revision_number
        expression: "revision_number >= 1"
      - name: ck_record_revision_not_self_supersedes
        expression: "supersedes_revision_id IS NULL OR supersedes_revision_id <> record_revision_id"
      - name: ck_record_revision_chain_root
        expression: "(revision_number = 1 AND supersedes_revision_id IS NULL) OR (revision_number > 1 AND supersedes_revision_id IS NOT NULL)"
      - name: ck_record_revision_content_json
        expression: "json_valid(content_json) AND content_hash = sha256(CAST(content_json AS VARCHAR))"
      - name: ck_record_revision_uuid5
        expression: "regexp_full_match(record_revision_id, '^[0-9a-f]{8}-[0-9a-f]{4}-5[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$')"
    fields:
      record_revision_id: {description: 不可变记录修订主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 修订所属的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      schema_version: {description: 解释本修订内容的schema版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      content_hash: {description: 修订规范内容的SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      revision_number: {description: 同一稳定实体内递增的修订序号, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      content_json: {description: 来源治理修订的规范内容或稳定内容定位, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      supersedes_revision_id: {description: 本次新修订明确替代且属于同一稳定实体的旧修订主键, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 修订生成UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      created_by: {description: 生成修订的主体或转换标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  snapshot_record:
    description: 快照为每个稳定实体选择且仅选择一个记录修订
    revision_policy: immutable_after_freeze
    primary_key: [snapshot_id, record_uid]
    unique_constraints:
      - name: uq_snapshot_record_revision
        fields: [snapshot_id, record_revision_id]
    foreign_keys:
      - name: fk_snapshot_record_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_revision_owner
        fields: [record_revision_id, record_uid]
        references: {table: record_revision, fields: [record_revision_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_snapshot_record_rule
        expression: "length(selection_rule_id) > 0 AND length(selection_rule_version) > 0"
    fields:
      snapshot_id: {description: 选择修订的数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 被选择修订的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_revision_id: {description: 快照实际选择的不可变记录修订, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      selection_rule_id: {description: 选择该修订的冻结规则标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      selection_rule_version: {description: 选择该修订的冻结规则版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      selected_at: {description: 快照选择修订的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  record_status_event:
    description: 对稳定实体六个生命周期轴追加且从不回写的状态变更事件
    revision_policy: immutable_append_only
    primary_key: [status_event_id]
    unique_constraints:
      - name: uq_record_status_event_sequence
        fields: [record_uid, status_axis, event_sequence]
      - name: uq_record_status_event_owner_axis
        fields: [status_event_id, record_uid, status_axis]
      - name: uq_record_status_event_owner
        fields: [status_event_id, record_uid]
    foreign_keys:
      - name: fk_record_status_event_registry
        fields: [record_uid, entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_status_event_previous_owner_axis
        fields: [previous_status_event_id, record_uid, status_axis]
        references: {table: record_status_event, fields: [status_event_id, record_uid, status_axis]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_record_status_event_sequence
        expression: "event_sequence >= 1"
      - name: ck_record_status_event_value
        expression: "length(trim(status_value)) > 0"
      - name: ck_record_status_event_not_self_previous
        expression: "previous_status_event_id IS NULL OR previous_status_event_id <> status_event_id"
    fields:
      status_event_id: {description: 不可变状态事件稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 发生状态事件的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      entity_type: {description: 由复合外键验证的状态事件目标实体类别, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      status_axis: {description: 六个生命周期状态轴之一, type: string, required: true, enum: lifecycle_status_axis, arrow_type: string, duckdb_type: VARCHAR}
      status_value: {description: 必须由QC按状态轴验证的目标枚举值, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      event_sequence: {description: 同一实体同一状态轴内从一开始连续递增的事件序号, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      previous_status_event_id: {description: 同一实体同一状态轴内紧邻的前一事件, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      reason_code: {description: 状态变化的稳定机器可读原因码, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_json: {description: 触发状态变化的结构化证据与规则版本, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      effective_at: {description: 状态事件生效的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      asserted_at: {description: 状态事件写入审计流的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      asserted_by: {description: 提交状态事件的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  snapshot_record_status:
    description: 快照为所选稳定实体绑定的六轴状态值及各自不可变事件依据
    revision_policy: immutable_after_freeze
    primary_key: [snapshot_id, record_uid]
    unique_constraints:
      - name: uq_snapshot_record_status_events
        fields: [snapshot_id, registration_status_event_id, availability_status_event_id, parse_status_event_id, scientific_admission_status_event_id, model_readiness_status_event_id, release_status_event_id]
    foreign_keys:
      - name: fk_snapshot_record_status_selection
        fields: [snapshot_id, record_uid]
        references: {table: snapshot_record, fields: [snapshot_id, record_uid]}
        cardinality: one_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_registry
        fields: [record_uid, entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_registration_event
        fields: [registration_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_availability_event
        fields: [availability_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_parse_event
        fields: [parse_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_scientific_event
        fields: [scientific_admission_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_model_event
        fields: [model_readiness_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_snapshot_record_status_release_event
        fields: [release_status_event_id, record_uid]
        references: {table: record_status_event, fields: [status_event_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_snapshot_record_status_distinct_events
        expression: "len(list_distinct([registration_status_event_id, availability_status_event_id, parse_status_event_id, scientific_admission_status_event_id, model_readiness_status_event_id, release_status_event_id])) = 6"
    fields:
      snapshot_id: {description: 绑定六轴状态选择的数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 被选择六轴状态的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      entity_type: {description: 由复合外键验证的状态选择目标实体类别, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      registration_status: {description: 本快照选择的实体登记状态, type: string, required: true, enum: registration_status, arrow_type: string, duckdb_type: VARCHAR}
      registration_status_event_id: {description: 支持登记状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      availability_status: {description: 本快照选择的实体可获得性状态, type: string, required: true, enum: availability_status, arrow_type: string, duckdb_type: VARCHAR}
      availability_status_event_id: {description: 支持可获得性状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      parse_status: {description: 本快照选择的实体解析状态, type: string, required: true, enum: parse_status, arrow_type: string, duckdb_type: VARCHAR}
      parse_status_event_id: {description: 支持解析状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      scientific_admission_status: {description: 本快照选择的实体科学准入状态, type: string, required: true, enum: scientific_admission_status, arrow_type: string, duckdb_type: VARCHAR}
      scientific_admission_status_event_id: {description: 支持科学准入状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      model_readiness_status: {description: 本快照选择的实体模型就绪状态, type: string, required: true, enum: model_readiness_status, arrow_type: string, duckdb_type: VARCHAR}
      model_readiness_status_event_id: {description: 支持模型就绪状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      release_status: {description: 本快照选择的实体发布审批状态, type: string, required: true, enum: release_status, arrow_type: string, duckdb_type: VARCHAR}
      release_status_event_id: {description: 支持发布审批状态选择的不可变事件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  record_source:
    description: 稳定记录到来源范围文件和精确定位的多对多血缘关联
    revision_policy: immutable_append_only
    primary_key: [record_source_id]
    unique_constraints:
      - name: uq_record_source_provenance
        fields: [record_uid, source_scope_id, source_file_id, source_locator_id, lineage_role]
    foreign_keys:
      - name: fk_record_source_registry
        fields: [record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_source_scope
        fields: [source_scope_id]
        references: {table: source_scope, fields: [source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_source_file_scope
        fields: [source_file_id, source_scope_id]
        references: {table: source_file, fields: [source_file_id, source_scope_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_source_locator_file
        fields: [source_locator_id, source_file_id]
        references: {table: source_locator, fields: [source_locator_id, source_file_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_record_source_evidence
        expression: "length(evidence_note) > 0"
    fields:
      record_source_id: {description: 记录到来源的血缘关联主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 被来源证据支持的稳定记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_scope_id: {description: 记录所属或取证的最具体来源范围, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_file_id: {description: 记录可回溯的原始来源文件, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_locator_id: {description: 记录在来源文件中的精确定位, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      lineage_role: {description: 原始证据方法规范派生验证或许可等血缘角色, type: string, required: true, enum: record_source_role, arrow_type: string, duckdb_type: VARCHAR}
      acquisition_method: {description: 记录由表格工作簿仓库文件文档数字化通信或项目重算进入项目的方式, type: string, required: true, enum: acquisition_method, arrow_type: string, duckdb_type: VARCHAR}
      evidence_quality: {description: 定位身份单位条件和语义完整性证据等级, type: string, required: true, enum: evidence_quality, arrow_type: string, duckdb_type: VARCHAR}
      evidence_note: {description: 证据质量与缺失冲突的可审计说明, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      assigned_at: {description: 记录与来源建立关联的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      assigned_by: {description: 建立来源血缘关联的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  transformation_run:
    description: 记录适配器代码参数输入输出哈希和运行环境的不可变转换执行
    revision_policy: immutable_append_only
    primary_key: [transformation_id]
    unique_constraints:
      - name: uq_transformation_signature_started
        fields: [transformation_signature, started_at]
    foreign_keys:
      - name: fk_transformation_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_transformation_code_hash
        expression: "length(code_hash) = 64 AND regexp_full_match(code_hash, '^[0-9a-f]{64}$')"
      - name: ck_transformation_input_hash
        expression: "length(input_hash) = 64 AND regexp_full_match(input_hash, '^[0-9a-f]{64}$')"
      - name: ck_transformation_output_hash
        expression: "output_hash IS NULL OR (length(output_hash) = 64 AND regexp_full_match(output_hash, '^[0-9a-f]{64}$'))"
      - name: ck_transformation_time_order
        expression: "completed_at IS NULL OR completed_at >= started_at"
    fields:
      transformation_id: {description: 不可变转换执行主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 转换执行所属的暂定或候选快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      transformation_signature: {description: 适配器代码参数和环境规范组合签名, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      adapter_name: {description: 执行转换的适配器模块名称, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      adapter_version: {description: 执行转换的适配器版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      code_hash: {description: 转换代码及依赖入口的SHA256摘要, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      parameters_json: {description: 过滤去重映射和算法参数的规范JSON, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      input_hash: {description: 全部转换输入身份和内容的规范SHA256, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      output_hash: {description: 成功执行后全部转换输出的规范SHA256, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      environment_hash: {description: Python系统区域时区和依赖锁的环境SHA256, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      status: {description: 转换计划运行成功失败或替代状态, type: string, required: true, enum: transformation_status, arrow_type: string, duckdb_type: VARCHAR}
      started_at: {description: 转换开始UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      completed_at: {description: 转换结束UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      executed_by: {description: 执行转换的主体或自动化运行标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  transformation_input:
    description: 将不可变转换执行显式绑定到实际读取的稳定记录修订
    revision_policy: immutable_append_only
    primary_key: [transformation_input_id]
    unique_constraints:
      - name: uq_transformation_input_record
        fields: [transformation_id, record_uid, record_revision_id]
      - name: uq_transformation_input_ordinal
        fields: [transformation_id, input_ordinal]
    foreign_keys:
      - name: fk_transformation_input_run
        fields: [transformation_id]
        references: {table: transformation_run, fields: [transformation_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_transformation_input_revision_owner
        fields: [record_revision_id, record_uid]
        references: {table: record_revision, fields: [record_revision_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_transformation_input_ordinal
        expression: "input_ordinal >= 0"
      - name: ck_transformation_input_role
        expression: "length(trim(input_role)) > 0"
    fields:
      transformation_input_id: {description: 转换输入关联稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      transformation_id: {description: 实际读取本输入修订的不可变转换执行, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 输入修订所属的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_revision_id: {description: 转换实际读取的不可变记录修订, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      input_ordinal: {description: 转换签名内稳定的非负输入顺序, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      input_role: {description: 本输入在转换中的机器可读语义角色, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  transformation_output:
    description: 将成功转换执行显式绑定到其实际产生的稳定记录修订
    revision_policy: immutable_append_only
    primary_key: [transformation_output_id]
    unique_constraints:
      - name: uq_transformation_output_record
        fields: [transformation_id, record_uid, record_revision_id]
      - name: uq_transformation_output_ordinal
        fields: [transformation_id, output_ordinal]
    foreign_keys:
      - name: fk_transformation_output_run
        fields: [transformation_id]
        references: {table: transformation_run, fields: [transformation_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_transformation_output_revision_owner
        fields: [record_revision_id, record_uid]
        references: {table: record_revision, fields: [record_revision_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_transformation_output_ordinal
        expression: "output_ordinal >= 0"
      - name: ck_transformation_output_role
        expression: "length(trim(output_role)) > 0"
    fields:
      transformation_output_id: {description: 转换输出关联稳定主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      transformation_id: {description: 实际产生本输出修订的不可变转换执行, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 输出修订所属的跨快照稳定实体, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_revision_id: {description: 转换实际产生的不可变记录修订, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      output_ordinal: {description: 转换签名内稳定的非负输出顺序, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      output_role: {description: 本输出在转换中的机器可读语义角色, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}

  record_lineage:
    description: 稳定记录之间有序且可回溯转换执行的方向性血缘边
    revision_policy: immutable_append_only
    primary_key: [lineage_id]
    unique_constraints:
      - name: uq_record_lineage_edge
        fields: [child_record_uid, parent_record_uid, relation_type, lineage_order]
    foreign_keys:
      - name: fk_record_lineage_child
        fields: [child_record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_lineage_parent
        fields: [parent_record_uid]
        references: {table: record_registry, fields: [record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_lineage_transformation
        fields: [transformation_id]
        references: {table: transformation_run, fields: [transformation_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_record_lineage_evidence_locator
        fields: [evidence_locator_id]
        references: {table: source_locator, fields: [source_locator_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_record_lineage_not_self
        expression: "child_record_uid <> parent_record_uid"
      - name: ck_record_lineage_order
        expression: "lineage_order >= 0"
      - name: ck_record_lineage_conversion_transform
        expression: "relation_type NOT IN ('extracted_from', 'normalized_from', 'derived_from', 'aggregated_from', 'computed_from') OR transformation_id IS NOT NULL"
      - name: ck_record_lineage_digitized_evidence
        expression: "relation_type <> 'digitized_from' OR transformation_id IS NOT NULL OR evidence_locator_id IS NOT NULL"
    fields:
      lineage_id: {description: 记录血缘边主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      child_record_uid: {description: 由父记录或转换产生的子稳定记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      parent_record_uid: {description: 向子记录贡献内容或身份的父稳定记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      relation_type: {description: 抽取规范派生汇总数字化计算替代等血缘关系, type: string, required: true, enum: lineage_relation_type, arrow_type: string, duckdb_type: VARCHAR}
      transformation_id: {description: 实际生成该血缘边的转换执行, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      evidence_locator_id: {description: 无自动转换时支持血缘判断的来源定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      lineage_order: {description: 同一子记录多父输入的稳定非负顺序, type: integer, required: true, arrow_type: int64, duckdb_type: BIGINT}
      review_status: {description: 血缘关系和方向的核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 血缘边登记UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  equivalence_group:
    description: 对精确重复父数据集出版物来源记录配方曲线和血缘族建立的防泄漏保护组
    revision_policy: immutable_append_only
    primary_key: [group_id]
    unique_constraints:
      - name: uq_equivalence_group_snapshot_key
        fields: [snapshot_id, group_type, group_key]
      - name: uq_equivalence_group_id_snapshot
        fields: [group_id, snapshot_id]
    foreign_keys:
      - name: fk_equivalence_group_snapshot
        fields: [snapshot_id]
        references: {table: dataset_snapshot, fields: [snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_equivalence_group_canonical_snapshot_record
        fields: [snapshot_id, canonical_record_uid]
        references: {table: snapshot_record, fields: [snapshot_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_equivalence_group_source_family
        fields: [source_family_id]
        references: {table: source_family, fields: [source_family_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_equivalence_group_key
        expression: "length(trim(group_key)) > 0"
      - name: ck_equivalence_group_method
        expression: "length(method_rule_id) > 0 AND length(method_rule_version) > 0"
    fields:
      group_id: {description: 等价或保护组主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 计算和审阅该保护组的数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      group_type: {description: 文件哈希母数据出版物配方曲线或血缘族等分组类型, type: string, required: true, enum: equivalence_group_type, arrow_type: string, duckdb_type: VARCHAR}
      group_key: {description: 分组证据与规则版本生成的稳定规范键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      canonical_record_uid: {description: 依据冻结规则选择且不删除其他成员的规范代表记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      source_family_id: {description: 可选的正式来源族且不得使用自由文本键替代, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      protected_from_partition_split: {description: 后续任何任务是否必须保持组内成员同分区, type: boolean, required: true, arrow_type: bool, duckdb_type: BOOLEAN}
      method_rule_id: {description: 生成分组的冻结规则标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      method_rule_version: {description: 生成分组的冻结规则版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_json: {description: 哈希匹配父子关系或人工裁决的结构化证据, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      review_status: {description: 分组身份和保护范围核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      created_at: {description: 等价或保护组建立UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  equivalence_membership:
    description: 将统一稳定记录以规范成员镜像子集父项或派生项角色加入等价保护组
    revision_policy: immutable_append_only
    primary_key: [membership_id]
    unique_constraints:
      - name: uq_equivalence_membership_record
        fields: [group_id, snapshot_id, record_uid]
    foreign_keys:
      - name: fk_equivalence_membership_group_snapshot
        fields: [group_id, snapshot_id]
        references: {table: equivalence_group, fields: [group_id, snapshot_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_equivalence_membership_snapshot_record
        fields: [snapshot_id, record_uid]
        references: {table: snapshot_record, fields: [snapshot_id, record_uid]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_equivalence_membership_locator
        fields: [evidence_locator_id]
        references: {table: source_locator, fields: [source_locator_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_equivalence_membership_confidence
        expression: "confidence >= 0.0 AND confidence <= 1.0"
    fields:
      membership_id: {description: 等价保护组成员关系主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      group_id: {description: 成员所属的等价或保护组, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      snapshot_id: {description: 成员必须已被选择的同一数据集快照, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      record_uid: {description: 加入分组的统一稳定记录, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      membership_relation: {description: 相对规范成员的普通父项子集镜像或派生关系, type: string, required: true, enum: equivalence_membership_relation, arrow_type: string, duckdb_type: VARCHAR}
      confidence: {description: 分组证据充分度的零到一审计值, type: number, required: true, arrow_type: float64, duckdb_type: DOUBLE}
      evidence_locator_id: {description: 支持成员关系判定的精确来源定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      review_status: {description: 成员关系人工核验状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      assigned_at: {description: 记录加入分组的UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

  exclusion_record:
    description: 对资产来源范围记录或字段作出的有证据排除和复审记录
    revision_policy: immutable_append_only
    primary_key: [exclusion_id]
    unique_constraints:
      - name: uq_exclusion_key
        fields: [exclusion_key]
    foreign_keys:
      - name: fk_exclusion_target
        fields: [target_uid, expected_entity_type]
        references: {table: record_registry, fields: [record_uid, entity_type]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_exclusion_evidence_package
        fields: [evidence_package_id]
        references: {table: rights_evidence_package, fields: [evidence_package_id]}
        cardinality: many_to_one
        on_delete: restrict
      - name: fk_exclusion_evidence_locator
        fields: [evidence_locator_id]
        references: {table: source_locator, fields: [source_locator_id]}
        cardinality: many_to_one
        on_delete: restrict
    checks:
      - name: ck_exclusion_evidence_available
        expression: "evidence_package_id IS NOT NULL OR evidence_locator_id IS NOT NULL OR length(details_json) > 1"
      - name: ck_exclusion_review_time
        expression: "reviewed_at IS NULL OR reviewed_at >= excluded_at"
    fields:
      exclusion_id: {description: 证据排除记录主键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      exclusion_key: {description: 目标范围字段原因和决定修订的规范稳定键, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      target_uid: {description: 被排除资产范围记录或字段所属的统一稳定对象, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      expected_entity_type: {description: 对排除目标实体类别的显式预期, type: string, required: true, enum: record_entity_type, arrow_type: string, duckdb_type: VARCHAR}
      exclusion_scope: {description: 排除作用于资产来源范围记录或单一字段, type: string, required: true, enum: exclusion_scope, arrow_type: string, duckdb_type: VARCHAR}
      field_name: {description: 字段级排除时被排除的冻结schema字段名, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      reason_code: {description: 不支持格式镜像派生视图权利失败或语义冲突等原因码, type: string, required: true, enum: exclusion_reason_code, arrow_type: string, duckdb_type: VARCHAR}
      decision_method: {description: 机器规则人工复核或证据排除方式, type: string, required: true, enum: decision_method, arrow_type: string, duckdb_type: VARCHAR}
      machine_rule_id: {description: 触发排除的冻结规则标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      machine_rule_version: {description: 触发排除的冻结规则版本, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      evidence_package_id: {description: 支持权利访问或撤回排除的不可变证据包, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      evidence_locator_id: {description: 支持内容格式或语义排除的精确来源定位, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      details_json: {description: 观察值期望值范围和补偿控制的结构化说明, type: json, required: true, arrow_type: string, duckdb_type: JSON}
      review_status: {description: 排除决定的核验复审与失效状态, type: string, required: true, enum: review_status, arrow_type: string, duckdb_type: VARCHAR}
      excluded_by: {description: 提出排除决定的主体标识, type: string, required: true, arrow_type: string, duckdb_type: VARCHAR}
      excluded_at: {description: 排除决定形成UTC时间, type: datetime, required: true, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      reviewed_by: {description: 与提出者分离的排除复核主体标识, type: string, required: false, arrow_type: string, duckdb_type: VARCHAR}
      reviewed_at: {description: 完成排除复核的UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}
      review_due_at: {description: 临时排除必须再次复审的UTC时间, type: datetime, required: false, arrow_type: "timestamp[us, tz=UTC]", duckdb_type: TIMESTAMPTZ}

conditional_required:
  - name: cr_dataset_snapshot_frozen_approval
    table: dataset_snapshot
    when: {field: snapshot_status, equals: frozen}
    require: [logical_hash, frozen_at, approved_by]
  - name: cr_source_file_scope_parent
    table: source_scope
    when: {field: scope_kind, equals: file}
    require: [parent_scope_id]
  - name: cr_logical_partition_scope_parent
    table: source_scope
    when: {field: scope_kind, equals: logical_partition}
    require: [parent_scope_id]
  - name: cr_asset_human_review_reviewer
    table: asset_decision
    when: {field: decision_method, equals: human_review}
    require: [reviewer]
  - name: cr_count_ingested_file
    table: count_assertion
    when: {field: count_evidence_type, equals: ingested_file_recount}
    require: [source_file_id, snapshot_id, filtering_rule, deduplication_rule, parser_version, source_file_sha256, recount_transformation_id]
  - name: cr_count_frozen_fact
    table: count_assertion
    when: {field: assertion_status, equals: frozen_fact}
    require: [source_file_id, snapshot_id, filtering_rule, deduplication_rule, parser_version, source_file_sha256, recount_transformation_id]
  - name: cr_rights_archived_verified_body
    table: rights_evidence_package
    when: {field: capture_status, equals: archived_verified}
    require: [body_archive_path, body_sha256, response_headers_json, verified_by, verified_at]
  - name: cr_rights_archived_unverified_body
    table: rights_evidence_package
    when: {field: capture_status, equals: archived_unverified}
    require: [body_archive_path, body_sha256, response_headers_json]
  - name: cr_rights_captured_session_fingerprint
    table: rights_evidence_package
    when: {field: capture_status, equals: captured_unverified}
    require: [session_fingerprint_sha256, session_fingerprint_scope]
  - name: cr_context_contracted_processor_name
    table: context_profile
    when: {field: processor_class, equals: contracted_processor}
    require: [external_processor_name]
  - name: cr_context_public_api_name
    table: context_profile
    when: {field: processor_class, equals: public_api}
    require: [external_processor_name]
  - name: cr_rights_obligations_payload
    table: rights_action_decision
    when: {field: decision, equals: allow_with_obligations}
    require: [obligations_json]
  - name: cr_record_lineage_extracted_transform
    table: record_lineage
    when: {field: relation_type, equals: extracted_from}
    require: [transformation_id]
  - name: cr_record_lineage_normalized_transform
    table: record_lineage
    when: {field: relation_type, equals: normalized_from}
    require: [transformation_id]
  - name: cr_record_lineage_derived_transform
    table: record_lineage
    when: {field: relation_type, equals: derived_from}
    require: [transformation_id]
  - name: cr_record_lineage_aggregated_transform
    table: record_lineage
    when: {field: relation_type, equals: aggregated_from}
    require: [transformation_id]
  - name: cr_record_lineage_computed_transform
    table: record_lineage
    when: {field: relation_type, equals: computed_from}
    require: [transformation_id]
  - name: cr_transformation_succeeded_output
    table: transformation_run
    when: {field: status, equals: succeeded}
    require: [output_hash, completed_at]
  - name: cr_exclusion_field_name
    table: exclusion_record
    when: {field: exclusion_scope, equals: field}
    require: [field_name]
  - name: cr_exclusion_verified_reviewer
    table: exclusion_record
    when: {field: review_status, equals: verified}
    require: [reviewed_by, reviewed_at]

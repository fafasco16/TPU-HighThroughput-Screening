schema_version: v0.1
description: TPU高通量筛选数据库v0.1核心字段字典；原始值与规范值并存。
tables:
  source:
    description: 论文、数据集或代码仓库级来源与许可状态。
    primary_key: [source_id]
    fields:
      source_id: {type: string, required: true, description: 稳定来源ID}
      citation: {type: string, required: false}
      doi: {type: string, required: false}
      url: {type: string, required: false}
      accessed_at: {type: date, required: true}
      license_spdx: {type: string, required: true}
      commercial_use: {type: boolean, required: false}
      derivatives_allowed: {type: boolean, required: false}
      redistribution_allowed: {type: boolean, required: false}
      attribution_text: {type: string, required: false}
      access_restriction: {type: string, required: true, enum: access_restriction}
      evidence_grade: {type: string, required: true, enum: evidence_grade}
      material_scope: {type: string, required: true, enum: material_scope}
      status: {type: string, required: true, enum: source_status}
      notes: {type: string, required: false}

  source_file:
    description: 原始文件完整性与项目内相对路径。
    primary_key: [source_file_id]
    fields:
      source_file_id: {type: string, required: true}
      source_id: {type: string, required: true}
      raw_path: {type: string, required: true}
      original_filename: {type: string, required: true}
      size_bytes: {type: integer, required: true}
      sha256: {type: string, required: true}
      mime_type: {type: string, required: false}
      accessed_at: {type: date, required: true}
      schema_version: {type: string, required: true}

  dataset_snapshot:
    description: 一次确定性数据库构建的输入、环境与输出摘要。
    primary_key: [snapshot_id]
    fields:
      snapshot_id: {type: string, required: true}
      schema_version: {type: string, required: true}
      code_commit: {type: string, required: false}
      environment: {type: json, required: true}
      input_hashes: {type: json, required: true}
      output_hashes: {type: json, required: true}
      row_counts: {type: json, required: true}
      built_at: {type: datetime, required: true}

  chemical:
    description: 原料或候选化学品结构与角色。
    primary_key: [chemical_id]
    fields:
      chemical_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      source_ids_json: {type: string, required: true, description: 全部贡献来源ID的JSON数组}
      source_file_ids_json: {type: string, required: true, description: 全部贡献文件ID的JSON数组}
      source_locators_json: {type: string, required: true, description: 全部贡献源定位的JSON数组}
      preferred_name: {type: string, required: false}
      cas_number: {type: string, required: false}
      smiles_raw: {type: string, required: false}
      smiles_canonical: {type: string, required: false}
      inchikey: {type: string, required: false}
      role_status: {type: string, required: true, enum: role_status}
      functionality: {type: number, required: false}
      license_spdx: {type: string, required: true}
      derivatives_allowed: {type: boolean, required: false}
      redistribution_allowed: {type: boolean, required: false}
      access_restriction: {type: string, required: true, enum: access_restriction}
      source_status: {type: string, required: true, enum: source_status}
      may_publish: {type: boolean, required: true}
      license_resolution_status: {type: string, required: true, enum: license_resolution_status}
      extraction_method: {type: string, required: true, enum: extraction_method}
      fidelity: {type: string, required: true, enum: evidence_grade}
      schema_version: {type: string, required: true}

  material_lot:
    description: 批次级原料质量信息。
    primary_key: [material_lot_id]
    fields:
      material_lot_id: {type: string, required: true}
      chemical_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      purity_fraction: {type: number, required: false}
      water_content_fraction: {type: number, required: false}
      mn_g_mol: {type: number, required: false}
      mw_g_mol: {type: number, required: false}
      dispersity: {type: number, required: false}
      hydroxyl_value_mg_koh_g: {type: number, required: false}
      nco_content_fraction: {type: number, required: false}
      schema_version: {type: string, required: true}

  formulation:
    description: 配方身份、计量关系与防泄漏分组。
    primary_key: [formulation_id]
    fields:
      formulation_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      sample_name_raw: {type: string, required: false}
      nco_oh_ratio: {type: number, required: false}
      hard_segment_fraction: {type: number, required: false}
      formulation_group: {type: string, required: true}
      chemistry_group: {type: string, required: true}
      lineage_family: {type: string, required: true}
      lineage_record_id: {type: string, required: true}
      split_group: {type: string, required: true}
      material_scope: {type: string, required: true, enum: material_scope}
      fidelity: {type: string, required: true, enum: evidence_grade}
      schema_version: {type: string, required: true}

  formulation_component:
    description: 配方与原料的多对多桥接表。
    primary_key: [formulation_id, component_index]
    fields:
      formulation_id: {type: string, required: true}
      component_index: {type: integer, required: true}
      chemical_id: {type: string, required: true}
      material_lot_id: {type: string, required: false}
      role_status: {type: string, required: true, enum: role_status}
      amount_raw: {type: number, required: false}
      unit_raw: {type: string, required: false}
      amount_fraction: {type: number, required: false}
      equivalent_ratio: {type: number, required: false}
      schema_version: {type: string, required: true}

  synthesis_batch:
    description: 合成和成型历史。
    primary_key: [batch_id]
    fields:
      batch_id: {type: string, required: true}
      formulation_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      synthesis_method: {type: string, required: false}
      addition_order: {type: string, required: false}
      temperature_k: {type: number, required: false}
      time_s: {type: number, required: false}
      atmosphere: {type: string, required: false}
      conversion_fraction: {type: number, required: false}
      schema_version: {type: string, required: true}

  specimen:
    description: 试样几何、调理与重复信息。
    primary_key: [specimen_id]
    fields:
      specimen_id: {type: string, required: true}
      batch_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      thickness_m: {type: number, required: false}
      orientation: {type: string, required: false}
      conditioning: {type: string, required: false}
      aging_time_s: {type: number, required: false}
      replicate_index: {type: integer, required: false}
      specimen_group: {type: string, required: true}
      schema_version: {type: string, required: true}

  test:
    description: 测试标准、模式与环境条件。
    primary_key: [test_id]
    fields:
      test_id: {type: string, required: true}
      specimen_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      test_type: {type: string, required: true}
      standard: {type: string, required: false}
      instrument: {type: string, required: false}
      temperature_k: {type: number, required: false}
      relative_humidity_fraction: {type: number, required: false}
      strain_rate_s_1: {type: number, required: false}
      frequency_hz: {type: number, required: false}
      cycle_count: {type: integer, required: false}
      schema_version: {type: string, required: true}

  property_value:
    description: 作者报告或规范化的标量性能。
    primary_key: [property_id]
    fields:
      property_id: {type: string, required: true}
      test_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      property_name: {type: string, required: true}
      value_raw: {type: number, required: false}
      unit_raw: {type: string, required: false}
      value_canonical: {type: number, required: false}
      unit_canonical: {type: string, required: false}
      unit_status: {type: string, required: true, enum: unit_status}
      uncertainty: {type: number, required: false}
      fidelity: {type: string, required: true, enum: evidence_grade}
      schema_version: {type: string, required: true}

  curve:
    description: 曲线元数据和轴定义。
    primary_key: [curve_id]
    fields:
      curve_id: {type: string, required: true}
      test_id: {type: string, required: true}
      source_id: {type: string, required: true}
      source_file_id: {type: string, required: true}
      source_locator: {type: string, required: true}
      curve_type: {type: string, required: true, enum: curve_type}
      x_name: {type: string, required: true}
      y_name: {type: string, required: true}
      cycle_index: {type: integer, required: false}
      stage: {type: string, required: false}
      extraction_method: {type: string, required: true, enum: extraction_method}
      fidelity: {type: string, required: true, enum: evidence_grade}
      schema_version: {type: string, required: true}

  curve_point:
    description: 保留原始点顺序的曲线长表。
    primary_key: [curve_id, point_index]
    fields:
      curve_id: {type: string, required: true}
      point_index: {type: integer, required: true}
      x_raw: {type: number, required: false}
      x_unit_raw: {type: string, required: false}
      y_raw: {type: number, required: false}
      y_unit_raw: {type: string, required: false}
      x_canonical: {type: number, required: false}
      x_unit_canonical: {type: string, required: false}
      y_canonical: {type: number, required: false}
      y_unit_canonical: {type: string, required: false}
      time_s: {type: number, required: false}
      temperature_k: {type: number, required: false}
      cycle_index: {type: integer, required: false}
      unit_status: {type: string, required: true, enum: unit_status}
      schema_version: {type: string, required: true}

  derived_property:
    description: 从曲线或规范表可复算的派生指标。
    primary_key: [derived_id]
    fields:
      derived_id: {type: string, required: true}
      curve_id: {type: string, required: true}
      property_name: {type: string, required: true}
      algorithm_version: {type: string, required: true}
      parameters: {type: json, required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      uncertainty: {type: number, required: false}
      point_count: {type: integer, required: true}
      warnings: {type: json, required: true}
      schema_version: {type: string, required: true}

  computation:
    description: 后续DFT或MD计算记录；与实验标签分层。
    primary_key: [computation_id]
    fields:
      computation_id: {type: string, required: true}
      formulation_id: {type: string, required: false}
      chemical_id: {type: string, required: false}
      computation_type: {type: string, required: true, enum: computation_type}
      software: {type: string, required: true}
      software_version: {type: string, required: false}
      method: {type: string, required: true}
      parameters: {type: json, required: true}
      converged: {type: boolean, required: true}
      schema_version: {type: string, required: true}

  prediction:
    description: 模型输出、不确定度和适用域状态。
    primary_key: [prediction_id]
    fields:
      prediction_id: {type: string, required: true}
      target_id: {type: string, required: true}
      target_type: {type: string, required: true}
      property_name: {type: string, required: true}
      model_id: {type: string, required: true}
      snapshot_id: {type: string, required: true}
      value: {type: number, required: true}
      unit: {type: string, required: true}
      uncertainty: {type: number, required: false}
      applicability_status: {type: string, required: true, enum: prediction_status}
      rank: {type: integer, required: false}
      schema_version: {type: string, required: true}

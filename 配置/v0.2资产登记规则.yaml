schema_version: v0.2
id_algorithm_version: uuid5-v1
rules_version: v0.2-asset-rules-2026-07-20-rc12
discovery_scope_key: local_raw_assets_v0.2

scan:
  root_hint: 01_原始数据
  follow_symlinks: false
  prune_directory_names:
    - .git
  path_normalization: unicode_nfc_posix
  stable_sort: casefold_then_nfc
  hash_algorithm: sha256_stream
  chunk_size_bytes: 1048576
  symlink_policy: block
  read_failure_policy: block
  unmatched_policy: block
  conflict_policy: block

duplicate_policy:
  group_key: content_sha256
  canonical_order: priority_desc_then_casefold_path

rules:
  - rule_id: root_readme
    priority: 1000
    path_regex: '^README\.md$'
    source_scope_key: local_discovery_documentation
    artifact_role: documentation
    data_stage: metadata_only
    material_scope_hint: unknown
    registration_status: discovered
    availability_status: available
    parse_status: not_applicable
    scientific_admission_status: pending
    model_readiness_status: ineligible
    release_status: not_assessed
    decision_basis: 项目原始数据根目录说明文件，仅用于治理解释。
    review_required: false

  - rule_id: base_openpoly
    priority: 1000
    path_regex: '^基础数据/openpoly\.csv$'
    source_scope_key: openpoly_local_export
    artifact_role: primary_data
    data_stage: raw
    material_scope_hint: general_polymer
    registration_status: discovered
    availability_status: available
    parse_status: not_attempted
    scientific_admission_status: pending
    model_readiness_status: not_assessed
    release_status: not_assessed
    decision_basis: OpenPoly 本地结构性质导出，保留为通用聚合物辅助数据。
    review_required: true

  - rule_id: base_pi1m_virtual_candidates
    priority: 1000
    path_regex: '^基础数据/PI1M_v2\.csv$'
    source_scope_key: pi1m_v2_local_export
    artifact_role: primary_data
    data_stage: raw
    material_scope_hint: virtual_candidate
    registration_status: discovered
    availability_status: available
    parse_status: not_attempted
    scientific_admission_status: pending
    model_readiness_status: not_assessed
    release_status: not_assessed
    decision_basis: PI1M 是虚拟聚合物候选空间，不声明为实验性能数据。
    review_required: true

  - rule_id: base_smipoly_monomer_rules
    priority: 1000
    path_regex: '^基础数据/smipoly_monomers\.csv$'
    source_scope_key: smipoly_public_monomer_examples
    artifact_role: primary_data
    data_stage: raw
    material_scope_hint: monomer_rule
    registration_status: discovered
    availability_status: available
    parse_status: not_attempted
    scientific_admission_status: pending
    model_readiness_status: not_assessed
    release_status: not_assessed
    decision_basis: SMiPoly 单体示例仅支持反应规则和候选生成，不提供实验标签。
    review_required: true

  - rule_id: base_internal_plan_workbook
    priority: 1000
    path_regex: '^基础数据/TPU_开源数据库与建库方案\.xlsx$'
    source_scope_key: local_discovery_documentation
    artifact_role: documentation
    data_stage: metadata_only
    material_scope_hint: unknown
    registration_status: discovered
    availability_status: available
    parse_status: not_applicable
    scientific_admission_status: pending
    model_readiness_status: ineligible
    release_status: not_assessed
    decision_basis: 内部建库方案工作簿，不作为第三方科学观测。
    review_required: false

  - rule_id: restricted_datasets
    priority: 1000
    path_regex: '^仅供参考/受限来源/(?:DiMPU2025|PUN2026)/source_data\.xlsx$'
    source_scope_key: restricted_reference_collection
    artifact_role: restricted_reference
    data_stage: reference_only
    material_scope_hint: linear_tpu
    registration_status: discovered
    availability_status: available
    parse_status: not_attempted
    scientific_admission_status: pending
    model_readiness_status: blocked
    release_status: denied
    decision_basis: 本地可读但来源条款限制，动作级权利裁决前仅受控参考。
    review_required: true

  - rule_id: restricted_readme
    priority: 1000

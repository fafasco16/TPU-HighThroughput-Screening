    base_weight_ceiling: 1.00
    group_keys: [dataset_doi, formulation, synthesis_batch]
    split_group_keys: [dataset_doi, formulation]
    note: 四种线性TPU配方和41个拉伸试样可进入核心实验候选；默认按DOI与配方拆分，批次和试样只保留作观测身份；接触角等表征单独成任务。

  - source_scope_key: scope_zenodo_17883052_dataset
    intended_use: dft_descriptor_with_experimental_deblocking_mapping
    base_weight_ceiling: 0.50
    group_keys: [dataset_doi, molecular_identity, dft_method, experimental_label_source]
    split_group_keys: [dataset_doi, molecular_identity]
    task_specific_ceilings:
      experimental_tdeblock_label: 1.00
      experimentally_mapped_dft_qoi_or_calibrated_descriptor: 0.50
      unmapped_cross_scale_dft_descriptor: 0.25
      gaussian_input_unconverged_or_unparsed_output: 0.00
    note: 实验Tdeblock标签属于独立实验保真层，上限1.00；Gaussian任务按真实分子与方法计数，只有与实验解封温度完成可审计映射的DFT输出可使用0.50上限，未映射描述符上限0.25。所有方法、荷电态、加合物与构象按molecular_identity同折，配套表、输入和输出不能重复形成标签。

  - source_scope_key: scope_jagiellonian_tyapfm_dataset
    intended_use: hard_segment_aimd_cross_scale
    base_weight_ceiling: 0.15
    group_keys: [dataset_doi, hard_segment_system, protocol, trajectory_seed]
    split_group_keys: [dataset_doi, hard_segment_system]
    future_ceiling_after_full_trajectory_audit: 0.30
    task_specific_ceilings:

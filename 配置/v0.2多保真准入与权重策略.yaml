    note: 当前只落地四个优化结构且XYZ未声明坐标单位；元素拓扑或尺度不变表示上限0.15，绝对距离、几何和氢键QoI硬置零。约3.58 GB完整轨迹取得并完成单位、协议、收敛与种子审计后，验证过的AIMD任务才可上调至0.30。


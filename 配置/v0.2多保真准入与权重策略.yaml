schema_version: v0.2
policy_version: multi-fidelity-admission-weight-v0.2.17
policy_status: design_only
training_enabled: false
training_split_created: false
training_weight_materialized: false
effective_after: null

# 本文件只冻结后续训练视图的权重边界，不创建训练集，也不改变原始观测事实。
# “权重上限”不是数据质量分数；正式权重必须在目标性质、适用域和分组切分确定后再物化。
principles:
  minimum_lineage_granularity: formulation_batch_specimen_curve
  independent_weight_unit: specimen
  curve_points_are_samples: false
  files_are_samples: false
  repeated_measurements_increase_formula_count: false
  source_mirror_increases_sample_count: false
  model_predictions_are_ground_truth: false
  simulation_inputs_have_target_weight: false
  simulation_frames_are_samples: false
  simulation_restarts_are_independent_without_seed_evidence: false
  normalize_within_curve: true
  normalize_within_specimen: true
  group_before_split:
    - source_family
    - study
    - synthesis_batch
    - formulation
    - specimen
    - exact_structure
  required_separation:
    - experimental_vs_computational
    - core_tpu_vs_transfer_domain
    - raw_vs_aggregate
    - observation_vs_model_output

# 参考准入采用渐进式门槛。可靠来源中的不完整计算或虚拟数据可以先进入
# 条件参考层；缺失字段影响任务适用性和未来权重，不再默认删除整条记录。
reference_admission_modes:
  admitted_reference:
    included_in_gold_reference: true
    included_in_direct_supervision: task_gate_dependent
    requirement: 来源、数据身份、体系/候选身份、方法或生成身份、数值定义与基本质量证据均可审计。
  conditional_reference:
    included_in_gold_reference: true
    included_in_direct_supervision: false
    missing_fields_are_progressive: true
    preserve_raw_and_numeric_outputs: true
    requirement: 来源可靠且可定位，计算/虚拟身份明确，体系或候选可辨。性质观测必须保留原始值与来源声明单位且不得猜测；无科学输出的模拟输入只能以复现资产身份保留，不得计作计算性能观测。
    record_role_gate:
      property_observation:
        numeric_value_required: true
        source_declared_unit_or_explicit_unresolved_unit_required: true
        counts_as_computational_performance_observation: true
      simulation_input:
        numeric_value_required: false
        counts_as_computational_performance_observation: false
        counts_toward_scalar_curve_or_point_labels: false
        allowed_use: reproducibility_asset_only
    allowed_uses:
      - literature_prior
      - chemical_space_reference
      - mechanism_hypothesis
      - representation_pretraining_after_rights_review
      - candidate_rescoring_after_task_gate
      - active_learning_pool
    non_blocking_gaps:
      - missing_training_or_redistribution_rights_evidence
      - incomplete_protocol_or_convergence_metadata
      - missing_experimental_mapping
      - simulation_input_without_scientific_output
    note: 上述缺口会把有效监督权重保持为0并限制用途；可靠模拟输入可作为Gold-C复现资产保留，但只有具有可审计科学输出的记录才能进入Gold-C计算性能观测数。
  blocked:
    included_in_gold_reference: false
    included_in_direct_supervision: false
    only_for:
      - unrecoverable_source_lineage
      - withdrawn_or_known_invalid_source
      - material_or_candidate_identity_unrecoverable
      - method_or_data_origin_unrecoverable
      - value_definition_or_unit_unrecoverable
      - prediction_disguised_as_experimental_truth
      - unresolved_exact_duplicate_without_new_information

source_reliability_levels:
  R1:
    description: 正式数据仓库或期刊官方补充材料，具有DOI/稳定版本、原件哈希和明确数据身份。
    default_reference_mode: admitted_reference
  R2:
    description: 可回溯到同行评议论文、作者机构库或作者仓库固定版本，数据身份清楚但部分协议或字段待补。
    default_reference_mode: conditional_reference
  R3:
    description: 可固定commit/版本且输入输出血缘可审计的预印本、代码仓库或方法数据；必须单独记录未同行评议和权利状态。
    default_reference_mode: conditional_reference
  R4:
    description: 无法回溯原始来源、版本或数据身份的镜像、截图、二次转载或匿名文件。
    default_reference_mode: blocked

# 总账字段 weight_ceiling 是缺口闭合后的潜在上限，不是当前有效训练权重。
# 下游不得只读取这个数值来选训练行，必须同时通过以下状态门。
weight_ceiling_semantics:
  meaning: potential_post_resolution_upper_bound
  is_current_training_weight: false
  conditional_reference_effective_supervision_weight: 0.0
  conditional_reference_may_keep_nonzero_potential_ceiling: true
  mandatory_application_gate:
    - gold_admission_status_is_admitted_reference
    - task_specific_scientific_gate_passed
    - train_rights_action_allowed
    - leakage_safe_split_group_materialized
    - model_ready_is_true
    - current_weight_materialized_is_true
  fail_closed_rule: 任一门未通过时有效监督权重为0；潜在上限只用于记录补全后的规划，不可直接参与损失函数。

# Gold 是“可追溯参考集合”，不是“全部等权真值”。可靠计算和虚拟候选可先
# 进入对应层，是否用于某个监督任务及其权重由后续任务门单独决定。
gold_layer_admission:
  Gold-E:
    admitted_origins: [experimental]
    minimum_requirement: 可追溯到来源、材料或配方身份、测试定义及单位；不完整字段显式为空而不是猜测。
    allowed_roles: [core_truth, transfer_reference, validation_only]
  Gold-C:
    admitted_origins: [dft, aimd, md, coarse_grained_md, cfd, population_balance, reaction_kinetics_simulation, finite_element]
    experimental_mapping_required_for_reference_admission: false
    protocol_complete_required_for_conditional_reference: false
    conditional_reference_can_preserve_numeric_outputs: true
    minimum_requirement: 来源可靠且可定位，体系与计算身份可辨，至少可确认方法类别、输出定义和原始单位；协议、收敛细节、适用域或实验映射缺失时进入条件参考，而不是删除。
    admitted_reference_upgrade_requirement: 输入输出血缘、方法版本、主要协议、收敛或质量证据和适用域达到任务所需完整度。
    allowed_without_experimental_mapping:
      - mechanism_descriptor
      - representation_pretraining
      - low_fidelity_label
      - candidate_rescoring
      - uncertainty_prior
    experimental_mapping_required_for:
      - claim_as_experimental_truth
      - direct_macroscopic_property_calibration
      - final_candidate_validation
  Gold-V:
    admitted_origins: [reaction_rule_generated, enumeration, group_contribution, model_generated, ml_prediction]
    minimum_requirement: 来源可靠且可定位，候选身份与至少一种结构表示可解析，规则生成或模型预测身份明确；缺少完整适用域、不确定度或父候选时进入条件参考并降低用途，不删除候选。
    experimental_label_required_for_reference_admission: false
    applicability_domain_required_for_conditional_reference: false
    uncertainty_required_for_conditional_reference: false
    allowed_uses: [chemical_space_enumeration, ranking, active_learning, acquisition_design, representation_pretraining]
    direct_experimental_property_supervision_weight: 0.0
    note: Gold-V中的预测值是候选证据而非实验真值；经可靠计算或实验验证后沿同一candidate_id升级，不重复建样本。

source_override_key_semantics:
  group_keys: 观测身份、血缘和组内归一维度；不得直接解释为训练拆分键。
  split_group_keys: 更粗粒度的泄漏阻断键；同键全部观测必须进入同一数据折。
  split_group_keys_required_before_materialization: true
  infer_split_group_from_group_keys: false
  missing_split_group_action: block_weight_and_split_materialization

# 这里只冻结未来物化算法的结构；当前不计算任何逐观测权重。
future_weight_materialization:
  formula: "W_obs = I_hard_gate * W_effective_ceiling * q_evidence * q_target * q_mapping * q_independence"
  hard_gate_values: [0, 1]
  factor_range: [0.0, 1.0]
  clipping_range: [0.0, 1.0]
  ceiling_resolution:
    - task_specific_source_override
    - source_override
    - default_fidelity_band
  ceiling_semantics: 最具体的任务—来源上限优先；没有覆盖时逐级回退，任何上限均不得超过1.0。默认带的minimum_weight只是候选设计区间下端，不是强制地板，质量因子和硬门可以把最终权重降至0。
  factors:
    q_evidence:
      Q1: 1.00
      Q2: 0.85
      Q3: 0.65
      Q4: 0.40
      Q5: 0.00
    q_target:
      same_qoi_same_definition: 1.00
      same_qoi_calibrated_domain_shift: 0.75
      calibrated_cross_scale_descriptor: 0.60
      representation_or_pretraining_only: 0.25
      out_of_scope: 0.00
    q_mapping:
      direct_specimen_observation: 1.00
      formulation_condition_aggregate: 0.75
      simulation_experiment_calibrated_pair: 0.70
      simulation_candidate_exact_mapping: 0.60
      simulation_component_or_segment_proxy_mapping: 0.35
      study_level_or_commercial_grade_only: 0.45
      no_auditable_mapping: 0.00
    q_independence:
      unique_formulation_batch_specimen: 1.00
      same_specimen_replicate_or_cycle_before_group_normalization: 1.00
      valid_derived_qoi_with_complete_lineage: 1.00
      resampled_or_duplicate_copy: 0.00
  cap_order:
    - apply_hard_zero
    - resolve_most_specific_effective_ceiling
    - multiply_quality_factors
    - normalize_within_curve
    - normalize_within_specimen
    - record_effective_sample_size_by_formulation_condition
    - apply_preregistered_task_source_balance_if_needed
  forbidden_shortcuts:
    - infer_weight_from_row_count
    - infer_weight_from_file_count
    - infer_weight_from_curve_point_count
    - infer_weight_from_simulation_frame_count
    - promote_prediction_to_ground_truth

target_task_rules:
  - task_key: tensile_curve_and_toughness
    highest_priority_origin: experimental
    acceptable_core_scope: [linear_tpu, thermoplastic_polyurethane_urea]
    simulation_role: mechanism_descriptor_or_regularizer
    note: 宏观韧性、强度、伸长和循环耗散必须由试样级实验主导；模拟不得直接冒充整条宏观曲线。
  - task_key: glass_transition_and_phase_mobility
    highest_priority_origin: experimental
    acceptable_simulation_origin: [md, coarse_grained_md]
    simulation_role: calibrated_cross_scale_observation
    note: 来源可靠且身份明确的MD迁移率或密度转折可进入Gold-C条件参考；只有协议、链长、组成、平衡和实验Tg映射达到任务要求时，才可作为Tg相关的直接低保真监督标签。
  - task_key: hydrogen_bond_and_deblocking_chemistry
    highest_priority_origin: [experimental, dft]
    acceptable_simulation_origin: [dft, md]
    simulation_role: molecular_descriptor
    note: DFT键能、局域电荷和氢键能可进入结构描述符层，但需保留泛函、基组、构象和收敛状态。
  - task_key: morphology_and_hard_segment_ordering
    highest_priority_origin: [experimental, md]
    acceptable_simulation_origin: [md, coarse_grained_md]
    simulation_role: morphology_descriptor
    note: 形貌任务按唯一体系—协议—种子聚合，帧数只提高统计精度，不增加独立样本权重。
  - task_key: reactive_foaming_process_window
    highest_priority_origin: [experimental, cfd]
    acceptable_simulation_origin: [cfd, population_balance, reaction_kinetics_simulation]
    simulation_role: process_kinetics_and_morphology_descriptor
    note: 经论文或实验校准、输入输出和单位可追溯的反应发泡CFD/PBE数据可进入Gold-C；时间步、网格单元、场变量和统计量只提高过程分辨率，不增加独立材料或计算体系数。

simulation_aggregation:
  independent_unit: unique_system_protocol_seed
  maximum_total_weight_per_unique_system_protocol_seed: 1.0
  maximum_total_weight_per_exact_molecular_system_qoi_across_protocols_and_conformers: 1.0
  maximum_total_weight_per_formulation_or_system_across_seeds: 1.0
  trajectory_frames_change_resolution_not_total_weight: true
  restart_requires_new_seed_and_independent_equilibration: true
  multiple_seeds_increase_precision_not_chemical_coverage: true
  uncertainty_rule: 多种子或多构象先聚合为体系级均值与不确定度；不能各自作为等权化学样本跨越体系总上限。
  minimum_reproducibility_fields_by_method:
    common:
      - molecular_system_identity
      - composition_and_chain_length
      - software_and_version
      - input_output_lineage
      - convergence_or_quality_evidence
    dft:
      - electronic_structure_method
      - functional_and_basis_set_or_plane_wave_cutoff
      - dispersion_and_solvation_settings_if_applicable
      - charge_and_multiplicity
      - geometry_conformer_and_calculation_type
      - scf_and_geometry_convergence_evidence
    md_or_aimd:
      - force_field_or_electronic_structure_method_version
      - boundary_conditions
      - ensemble_and_thermostat_barostat_if_applicable
      - equilibration_protocol
      - production_protocol_and_timestep
      - random_seed_if_stochastic
      - convergence_or_stationarity_evidence
  applicability_rule: 方法专属字段只在科学上适用时强制；确定性DFT不因缺少随机种子或MD系综字段被误阻断，MD/AIMD则必须记录适用的系综、平衡、生产段和随机性证据。
  experimental_calibration_required_for_primary_computational_use: true
  experimental_calibration_required_for_gold_c_reference_admission: false
  uncalibrated_reproducible_simulation_allowed_uses:
    - mechanism_descriptor
    - representation_pretraining
    - low_fidelity_label
    - candidate_rescoring

derived_qoi_handling:
  valid_requirements:
    - parent_curve_lineage
    - quantity_definition
    - unit
    - derivation_algorithm_and_version
    - integration_or_fit_bounds
    - qc_status
  standalone_target_factor: 1.0
  independent_sample_increment: 0
  joint_use_with_parent_curve: same_specimen_loss_budget_or_explicit_multitask_objective
  duplicate_or_resampled_copy_factor: 0.0
  note: 韧性、滞后面积、模量等可复算QoI是合法任务标签；它们不增加独立试样数，与母曲线联合使用时不得形成双重监督放大。

default_weight_bands:
  - policy_key: experimental_core_raw
    origin_kind: experimental
    scientific_use_class: primary_experimental
    required_scope: core_tpu
    minimum_weight: 0.80
    maximum_weight: 1.00
    normalization_unit: specimen
    rationale: 配方、批次、试样、性质、单位、条件和血缘完整的TPU原始实验是主任务参考层。

  - policy_key: experimental_core_published_aggregate
    origin_kind: experimental
    scientific_use_class: primary_experimental
    required_scope: core_tpu
    reduction_level: aggregate
    minimum_weight: 0.45
    maximum_weight: 0.65
    normalization_unit: formulation_condition
    rationale: 论文汇总值丢失重复与曲线内信息，保留但低于原始试样数据。

  - policy_key: experimental_transfer_raw
    origin_kind: experimental
    scientific_use_class: auxiliary
    required_scope: transfer_domain
    minimum_weight: 0.15
    maximum_weight: 0.35
    normalization_unit: specimen_or_curve
    rationale: 泡沫、热固、交联、复合物和器件数据只支持迁移学习或表征预训练，不直接主导线性TPU终点。

  - policy_key: dft_validated_mapping
    origin_kind: dft
    scientific_use_class: primary_computational
    required_scope: mapped_same_qoi_or_calibrated_descriptor
    minimum_weight: 0.30
    maximum_weight: 0.50
    normalization_unit: unique_molecular_system_and_method
    rationale: 方法完整、收敛通过且与实验标签有可审计映射的DFT可进入多保真视图，但不等价于宏观实验真值。

  - policy_key: dft_unmapped_descriptor
    origin_kind: dft
    scientific_use_class: auxiliary
    required_scope: cross_scale_descriptor
    minimum_weight: 0.10
    maximum_weight: 0.25
    normalization_unit: unique_molecular_system_and_method
    rationale: 未完成同一QoI校准的键能、轨道或电荷仅作跨尺度描述符。

  - policy_key: md_or_aimd_validated
    origin_kind: md
    scientific_use_class: primary_computational
    required_scope: protocol_complete_and_mapped
    minimum_weight: 0.20
    maximum_weight: 0.40
    normalization_unit: unique_system_protocol_seed
    rationale: 力场或从头算协议、平衡、生产段、独立种子和输出完整时，才可作为计算层观测。

  - policy_key: md_or_aimd_unmapped_reference
    origin_kind: md
    method_family: [md, aimd]
    scientific_use_class: auxiliary
    required_scope: protocol_complete_system_mapped_without_experimental_pair
    minimum_weight: 0.05
    maximum_weight: 0.20
    normalization_unit: unique_system_protocol_seed
    rationale: 没有实验配对但体系、协议、输出和质量证据完整的MD/AIMD仍可进入Gold-C参考层，用于机理、表示、低保真复筛和不确定度先验；不得声称为实验真值。

  - policy_key: group_contribution_or_virtual_candidate
    origin_kind: group_contribution
    scientific_use_class: representation
    minimum_weight: 0.00
    maximum_weight: 0.15
    normalization_unit: unique_structure_method_version
    rationale: 用于候选排序、表示学习或先验，不作为实验性能标签。

  - policy_key: model_prediction
    origin_kind: ml_prediction
    scientific_use_class: audit_only
    minimum_weight: 0.00
    maximum_weight: 0.00
    normalization_unit: prediction_lineage
    rationale: 模型预测可保存用于审计、蒸馏研究或主动学习，但默认不回灌为真值。
    gold_layer: Gold-V
    candidate_ranking_allowed: true

  - policy_key: simulation_input_or_code
    artifact_roles: [simulation_input, code, model_artifact]
    minimum_weight: 0.00
    maximum_weight: 0.00
    normalization_unit: asset
    rationale: 输入、代码和模型文件提供可复现性，不产生目标标签。

# 下列零门只作用于未来任务训练权重；除“来源撤回/身份不可恢复”等参考阻断项外，
# 不自动把可靠来源的原始记录从Gold条件参考层删除。
hard_zero_conditions_scope: future_task_training_weight_only
hard_zero_conditions:
  - mirror_duplicate
  - derived_duplicate_without_new_measurement
  - source_file_without_scientific_observation
  - apple_double_or_operating_system_metadata
  - parser_failed_or_unsupported
  - missing_property_definition
  - missing_unit_without_recoverable_evidence
  - declared_unit_or_scale_conflict_unresolved
  - coordinate_scale_undeclared_for_absolute_geometry_qoi
  - simulation_not_converged
  - simulation_input_without_output
  - model_output_used_as_ground_truth
  - rights_blocked_for_training
  - withdrawn_source

curve_weighting:
  point_loss_rule: each_curve_loss_is_mean_over_valid_points
  specimen_loss_rule: each_specimen_is_mean_over_its_curves
  formulation_loss_rule: retain_independent_specimens_and_report_effective_sample_size
  maximum_total_weight_per_specimen: 1.0
  formulation_condition_total_cap: task_specific_not_materialized
  independent_specimens_increase_statistical_precision: true
  independent_specimens_increase_chemical_space: false
  repeated_cycle_policy: retain_sequence_but_do_not_multiply_independent_sample_weight
  resampling_policy: resampling_changes_resolution_not_total_weight

cross_source_equivalence_caps:
  global_polymer_structure_qoi_maximum_total_weight: 0.20
  grouping_key: [global_structure_family_key, property_name]
  split_key: global_structure_family_key
  duplicate_release_policy: 保留各来源与模拟工况作为可追溯增厚证据，但同一化学结构同一性质跨来源不增加化学覆盖度，且必须同折。
  known_batch9_overlap_audit:
    radonpy_polyomics_shared_structure_count: 11
    polyomics_run_count_in_shared_structures: 58

source_overrides:
  - source_scope_key: scope_radonpy_pi1070_840dd4a
    intended_use: pu_repeat_unit_dft_md_nemd_transfer_reference
    base_weight_ceiling: 0.20
    group_keys: [fixed_commit, global_structure_family_key, method_family, property_name]
    split_group_keys: [global_structure_family_key]
    task_specific_ceilings:
      dft_descriptor: 0.20
      equilibrium_md_property: 0.20
      nemd_thermal_property: 0.20
      segmented_tpu_direct_property: 0.00
    note: polymer_class=11只证明聚氨酯重复单元，不证明分段TPU配方；440个数值保留方法、单位和工况，当前不物化权重。

  - source_scope_key: polyomics_general_version
    intended_use: polyurethane_and_polyurea_multifidelity_computational_reference
    base_weight_ceiling: 0.20
    group_keys: [dataset_revision, global_structure_family_key, simulation_key, property_name]
    split_group_keys: [global_structure_family_key]
    task_specific_ceilings:
      purt_equilibrium_verified_property: 0.20
      pura_adjacent_transfer_property: 0.10
      thermal_conductivity_check_passed: 0.20
      thermal_conductivity_check_failed_or_unchecked: 0.00
      segmented_tpu_direct_property: 0.00

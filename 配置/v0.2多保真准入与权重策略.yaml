    base_weight_ceiling: 1.00
    group_keys: [dataset_doi, polymer_backbone, formulation, synthesis_batch, specimen]
    split_group_keys: [dataset_doi, polymer_backbone, formulation]
    note: 低天花板温度聚合物TPUU可进入核心化学—力学—回收任务；同一配方的不同批次、多温度、多模态与原始仪器目录必须同组。

  - source_scope_key: scope_qub_83fdb865_dataset
